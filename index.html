 w:'The brain\'s emotional systems respond strongly to immediate discomfort — boredom, anxiety, fear of failing. The planning systems that care about next week are quieter. When a task triggers discomfort, escaping it delivers instant relief, and relief is rewarding.',
 h:'Each avoidance is reinforced: discomfort → escape → relief. Over time, the task becomes a stronger trigger for avoidance. Research shows that self-forgiveness after procrastinating reduces future procrastination, while self-criticism increases it — because guilt is another bad feeling to escape. Breaking a task into a tiny first step lowers the emotional wall.',
 e:'People delay opening a bill more when they expect it to be large. The information does not change; the anticipated feeling does.',
 f:'Chronic procrastinators show higher activity in the amygdala, the brain\'s threat detector — suggesting tasks literally feel more threatening to them.',
 v:[['Emotional regulation','Managing how you respond to feelings.'],['Present bias','Overweighting immediate rewards and costs compared with future ones.']],
 q:[['According to research, what is procrastination mainly about?',['Laziness','Poor calendar skills','Avoiding uncomfortable emotions','Lack of intelligence'],2,'It is primarily short-term mood repair.']]}],

['psy_decision','Why Do Too Many Choices Make Us Unhappy?','Thirty kinds of jam should be better than six. Shoppers disagree with their feet.','Psychology','Decision Making','easy',6,['choice','decisions','happiness','paradox'],['psy_loss_aversion','econ_scarcity'],{
 s:'Beyond a certain point, more options increase effort, raise expectations and multiply regret — so satisfaction falls even as freedom rises.',
 w:'Every extra option is another comparison to make and another thing you give up when you choose. The brain counts those foregone options as small losses. With six jams, you gave up five; with thirty, twenty-nine.',
 h:'In a famous supermarket study, a table with 24 jams attracted more browsers but produced far fewer purchases than a table with 6. Psychologists distinguish "maximisers", who seek the best possible option and suffer more regret, from "satisficers", who pick the first good-enough option and report higher happiness.',
 e:'Streaming services offer thousands of films, and people spend a surprising share of the evening scrolling rather than watching.',
 f:'Setting your own rules in advance — "I only look at three options" — measurably reduces decision fatigue and increases satisfaction with whatever you pick.',
 v:[['Choice overload','Reduced satisfaction and decision-making when faced with too many options.'],['Satisficing','Choosing an option that is good enough rather than searching for the best.']],
 q:[['Who tends to be happier with their decisions?',['Maximisers who compare everything','Satisficers who pick a good-enough option','People who never decide','People who choose randomly'],1,'Satisficers report less regret and higher satisfaction.']]}],

['neuro_sleep_memory','Why Does Sleep Help You Remember?','Study, then sleep, and you wake up knowing more than when you went to bed. What happened?','Neuroscience','Sleep','comfortable',8,['sleep','memory','consolidation','brain'],['psy_dream','psy_forget','psy_spacing'],{
 s:'During sleep the brain replays the day\'s experiences and moves important memories from temporary storage in the hippocampus to long-term storage in the cortex.',
 w:'The hippocampus is a fast-learning but limited notebook. The cortex is a huge but slow-learning library. Sleep is when the notebook is copied into the library — a job that would interfere with normal thinking if it happened while you were awake.',
 h:'In deep slow-wave sleep, bursts of activity called sleep spindles and sharp-wave ripples replay recent neural patterns at high speed, sometimes twenty times faster than the original experience. Emotional and skill memories are further processed during REM sleep. The brain also clears metabolic waste through the glymphatic system, which is far more active during sleep.',
 e:'Rats that learned a maze show the same sequence of place-cell firing during sleep as when they ran the maze — the brain literally rehearses the route.',
 f:'A short nap of 60–90 minutes after learning produces measurable improvements in recall, while pulling an all-nighter can cut the ability to form new memories by around 40%.',
 v:[['Consolidation','Stabilising and strengthening memories after initial learning.'],['Slow-wave sleep','The deepest sleep stage, crucial for memory transfer.']],
 q:[['What happens to memories during deep sleep?',['They are deleted','They are replayed and transferred to long-term storage','They stay unchanged','They move to the eyes'],1,'Replay transfers memories from hippocampus to cortex.']], pre:['psy_forget']}],

['neuro_amygdala','Why Does Fear Feel So Fast?','You jump back from the snake before you consciously see it. Then you realise it was a stick.','Neuroscience','Emotion','comfortable',7,['fear','amygdala','emotion','reflex'],['psy_memreal','neuro_attention'],{
 s:'The brain has a fast, rough fear pathway that triggers a reaction before the slower, detailed pathway has finished working out what you are actually looking at.',
 w:'Being a fraction of a second too slow to react to a predator was fatal; jumping away from a stick was merely embarrassing. Evolution built a shortcut that trades accuracy for speed.',
 h:'Sensory information reaches the thalamus and splits. A "low road" goes straight to the amygdala, which can trigger a startle, a heartbeat spike and a flinch in about 12 milliseconds. A "high road" passes through the visual cortex for detailed analysis and arrives tens of milliseconds later — often to cancel the alarm. The amygdala also tags the memory with emotion, which is why frightening events are remembered so vividly.',
 e:'A sudden loud noise makes you flinch before you know what it was. The identification comes a beat later — and if it was harmless, you laugh.',
 f:'People whose amygdalae are damaged by a rare disease report feeling almost no fear, even when handling snakes and spiders they had previously described as terrifying.',
 v:[['Amygdala','An almond-shaped brain structure central to fear and emotional memory.'],['Thalamus','A relay station that routes sensory information within the brain.']],
 q:[['Why do you flinch before consciously recognising a threat?',['Your eyes are slow','A fast, rough pathway reaches the amygdala before detailed analysis finishes','Fear is imaginary','Muscles react on their own'],1,'The "low road" trades accuracy for speed.']]}],

['neuro_dopamine','What Does Dopamine Actually Do?','It is called the pleasure chemical. It is not really about pleasure at all.','Neuroscience','Neurochemistry','comfortable',8,['dopamine','motivation','reward','habits'],['mus_goose','neuro_habits','psy_procrastinate'],{
 s:'Dopamine is less about enjoying things and more about wanting them. It signals that a reward might be coming and pushes you to act — especially when the outcome is uncertain.',
 w:'An animal that only felt pleasure after eating would never bother to hunt. A chemical that fires in anticipation — that makes the search itself feel urgent — keeps animals moving toward food, mates and safety.',
 h:'Dopamine neurons fire most strongly when a reward is better than expected, and dip when it is worse. This "prediction error" teaches the brain what to pursue. Once a reward becomes predictable, dopamine shifts to the cue that predicts it. Unpredictable rewards — a slot machine, a phone notification — keep dopamine high because the brain can never settle its prediction.',
 e:'Checking your phone for messages is rewarding even when nothing is there. The possibility drives the check; the actual message is almost secondary.',
 f:'Rats whose dopamine system is blocked still enjoy sugar — they lick their lips when it is placed in their mouths — but they will not walk a few steps to get it.',
 v:[['Prediction error','The gap between what was expected and what actually happened; the signal dopamine encodes.'],['Wanting vs liking','The distinction between motivation to pursue a reward and pleasure in receiving it.']],
 q:[['When do dopamine neurons fire most strongly?',['When a reward is exactly as expected','When a reward is better than expected','When you are asleep','Only during eating'],1,'Better-than-expected outcomes produce the biggest dopamine signal.']]}],

['neuro_consciousness','What Is Consciousness?','You are having an experience right now. Nobody can fully explain why there is anything it is like to be you.','Neuroscience','Mind','challenge',12,['consciousness','mind','philosophy','brain','hard problem'],['phil_ship','phil_free_will','ai_turing'],{
 s:'Consciousness is subjective experience — the felt quality of seeing red or tasting coffee. Science can map which brain processes accompany it, but why those processes feel like anything is still an open question.',
 w:'The brain is a physical system that processes information. Many systems process information — thermostats, computers — without, as far as we know, experiencing anything. What makes brains different is the "hard problem": explaining why physical activity is accompanied by inner experience at all.',
 h:'Leading theories differ. Global Workspace Theory says information becomes conscious when it is broadcast widely across the brain, available to memory, speech and planning at once. Integrated Information Theory proposes that consciousness corresponds to how much information a system integrates as a whole. Higher-order theories argue that a state is conscious when the brain represents itself as being in that state. Experiments track the "neural correlates" — patterns that appear when a perception becomes reportable — but correlates are not yet explanations.',
 e:'Under anaesthesia, sensory areas still respond to sounds, but long-range communication across the brain breaks down. The information arrives; the experience does not.',
 f:'In "blindsight", people with damage to the visual cortex insist they see nothing, yet correctly guess the location of objects far above chance. Processing continues without experience.',
 v:[['Hard problem','Why and how physical processes give rise to subjective experience.'],['Neural correlates of consciousness','Brain activity patterns that reliably accompany conscious experience.'],['Global workspace','A theory that consciousness is information broadcast across the whole brain.']],
 q:[['What is the "hard problem" of consciousness?',['Measuring brain size','Explaining why brain activity is accompanied by experience','Curing headaches','Building faster computers'],1,'It is the explanatory gap between physical process and felt experience.']], pre:['neuro_plastic'], next:['ai_turing','phil_free_will']}],

['neuro_habits','How Do Habits Form in the Brain?','You lock the door without remembering doing it. A different part of your brain has taken over.','Neuroscience','Behaviour','comfortable',8,['habits','basal ganglia','routine','behaviour'],['neuro_plastic','neuro_dopamine','psy_procrastinate'],{
 s:'A habit is a behaviour that has moved from the deliberate, effortful part of the brain to the automatic part. A cue triggers a routine that delivers a reward — and repetition welds the three together.',
 w:'Conscious decision-making is expensive. If every action required deliberation, you would be exhausted by breakfast. The brain economises by converting repeated behaviours into automatic sequences that run with almost no attention.',
 h:'New behaviours are managed by the prefrontal cortex. As they repeat, control shifts to the basal ganglia, especially the striatum, which "chunks" the sequence into one unit. Brain recordings show activity spiking at the start and end of a habit and going quiet in between — the middle runs on autopilot. This is why habits survive even when the reward disappears, and why changing a habit works best by keeping the cue and reward but swapping the routine.',
 e:'You drive a familiar route and arrive with no memory of the journey. The turns were chunked into one automatic sequence; your conscious mind was elsewhere.',
 f:'Studies suggest around 40% of daily actions are habits rather than decisions — and that new habits take anywhere from 18 to 254 days to become automatic, depending on the person and behaviour.',
 v:[['Basal ganglia','Deep brain structures that store and run automatic behaviours.'],['Habit loop','Cue → routine → reward, the pattern that defines a habit.']],
 q:[['Where does control shift as a behaviour becomes a habit?',['From the basal ganglia to the prefrontal cortex','From the prefrontal cortex to the basal ganglia','To the spinal cord','To the eyes'],1,'Automatic behaviours are managed by the basal ganglia.']], pre:['neuro_plastic']}],

['neuro_attention','Why Can\'t You Really Multitask?','You are sure you can text and listen at the same time. Your brain is quietly switching, not sharing.','Neuroscience','Attention','easy',6,['attention','multitasking','focus','productivity'],['psy_flow','neuro_amygdala'],{
 s:'The brain cannot consciously focus on two demanding tasks at once. What feels like multitasking is rapid switching, and every switch costs time and accuracy.',
 w:'Conscious attention is a single spotlight, not a floodlight. Only tasks that have become fully automatic — walking, chewing — can run alongside it. Anything requiring thought queues up for the same limited resource.',
 h:'Each time you switch, the brain must reload the "rules" of the new task and suppress the old ones. These switch costs add up: studies estimate that heavy task-switching can reduce productive time by up to 40%. People who multitask most rate themselves as best at it — and perform worst on attention tests.',
 e:'Talking on a hands-free phone while driving slows reaction times about as much as being over the legal alcohol limit. The hands are free; the attention is not.',
 f:'Simply having your phone visible on the desk — even face down and silent — measurably reduces working memory capacity, because part of your attention is spent not checking it.',
 v:[['Switch cost','The time and accuracy lost when attention moves between tasks.'],['Working memory','The small amount of information you can hold and use at once.']],
 q:[['What is actually happening when you think you are multitasking?',['Two tasks run in parallel','Your brain rapidly switches between tasks','One task runs in your spine','Nothing — it is an illusion of doing anything'],1,'Rapid switching, each with a cost.']]}],

['space_stars_die','What Happens When a Star Dies?','Every atom of iron in your blood was forged inside a star that no longer exists.','Space','Stars','comfortable',8,['stars','supernova','elements','life cycle'],['space_bh','space_light_years','chem_blood'],{
 s:'When a star runs out of fuel, gravity wins. Small stars swell and gently shed their outer layers; giant stars collapse and explode, scattering the elements that make planets and people.',
 w:'A star is a balance between gravity pulling inward and the pressure of nuclear fusion pushing outward. Fusion needs fuel. When hydrogen runs low, the star burns heavier elements in stages — helium, carbon, oxygen — until it either cannot go further or reaches iron, which absorbs energy instead of releasing it.',
 h:'Sun-sized stars expand into red giants, puff off their outer layers as glowing nebulae, and leave a dense white dwarf. Stars over about eight solar masses build an iron core that collapses in under a second, triggering a supernova brighter than a whole galaxy. The blast forges elements heavier than iron — gold, uranium — and spreads everything into space, where it seeds the next generation of stars and planets.',
 e:'The Crab Nebula is the expanding debris of a supernova seen by Chinese astronomers in 1054. It was visible in daylight for weeks.',
 f:'The calcium in your bones, the oxygen you breathe and the iron in your blood were all made inside stars. The Sun itself is a third-generation star built from earlier stellar deaths.',
 v:[['Supernova','The explosive death of a massive star.'],['White dwarf','The dense, cooling remnant of a Sun-like star.']],
 q:[['Why does fusion stop at iron in massive stars?',['Iron is too heavy to lift','Fusing iron absorbs energy rather than releasing it','Iron melts','Stars run out of iron'],1,'Iron fusion consumes energy, so the core can no longer support itself.']], next:['space_bh']}],

['space_orbit','Why Don\'t Satellites Fall Down?','A satellite is falling right now. It just keeps missing the Earth.','Space','Orbital Mechanics','easy',6,['orbit','gravity','satellites','physics'],['tech_gps','space_moon_tides','phy_relativity'],{
 s:'A satellite is constantly falling toward Earth — but it is also moving sideways so fast that the ground curves away beneath it at the same rate. Falling forever, never landing, is an orbit.',
 w:'Gravity does not switch off in space; at the altitude of the space station it is about 90% as strong as on the ground. What keeps things up is not lack of gravity but sideways speed.',
 h:'Newton imagined firing a cannon from a mountain. Fire it slowly and the ball lands nearby. Faster, and it lands further away. At around 7.8 kilometres per second, the ball falls at exactly the rate the Earth curves away — and never lands. Astronauts float because they and their spacecraft are falling together, not because gravity is absent.',
 e:'The International Space Station circles Earth every 90 minutes at 28,000 km/h. Astronauts see sixteen sunrises a day.',
 f:'Satellites in very low orbits do slowly fall, because traces of atmosphere drag on them. The space station needs periodic boosts or it would re-enter within a couple of years.',
 v:[['Orbit','A curved path in which an object continuously falls around a larger body.'],['Microgravity','The apparent weightlessness of objects in free fall together.']],
 q:[['Why do astronauts float in the space station?',['There is no gravity in space','They and the station are falling together around Earth','The station has anti-gravity engines','Air pressure lifts them'],1,'Weightlessness is shared free fall, not absent gravity.']]}],

['space_moon_tides','Why Does the Moon Cause Tides?','Twice a day the sea rises and falls, pulled by a rock 384,000 kilometres away.','Space','Solar System','easy',6,['moon','tides','gravity','ocean'],['space_orbit','geo_currents'],{
 s:'The Moon\'s gravity pulls harder on the side of Earth facing it than on the far side. That difference stretches the oceans into two bulges — and Earth rotates through both each day.',
 w:'Gravity weakens with distance. The ocean nearest the Moon is pulled slightly more than Earth\'s centre, and the centre slightly more than the far-side ocean. The result is a stretch along the Earth–Moon line, creating high water on both the near and far sides.',
 h:'As Earth spins, any coastline passes through both bulges, giving two high tides about 12 hours 25 minutes apart — the extra 25 minutes because the Moon has moved along its orbit. The Sun adds its own smaller tide; when Sun and Moon line up (new and full moon), tides are largest (spring tides); at right angles, smallest (neap tides). Coastline shape can amplify the effect enormously.',
 e:'The Bay of Fundy in Canada has tides of up to 16 metres — the height of a five-storey building — because the bay\'s shape resonates with the tidal rhythm.',
 f:'Tidal friction is slowing Earth\'s spin by about 2 milliseconds per century and pushing the Moon away by 3.8 centimetres a year. Dinosaurs lived through 23-hour days.',
 v:[['Tidal force','The stretching effect caused by gravity being stronger on the near side than the far side.'],['Spring tide','An especially large tide when Sun and Moon align.']],
 q:[['Why are there two high tides a day rather than one?',['The Moon orbits twice a day','The oceans bulge on both the near and far sides of Earth','The Sun causes the second one','There is only one high tide'],1,'The tidal stretch creates two bulges.']]}],

['space_light_years','Why Is Looking at Stars Looking Back in Time?','Some of the stars you see tonight may no longer exist.','Space','Cosmology','easy',5,['light','time','distance','universe'],['space_stars_die','phy_relativity'],{
 s:'Light takes time to travel. When you see a star, you see light that left it years, centuries or millennia ago — a picture of the past, not the present.',
 w:'Light is fast — about 300,000 kilometres per second — but the universe is unimaginably large. Nothing you see is instantaneous; you always see things as they were when the light left them. For nearby objects the delay is trivial. For stars, it is history.',
 h:'A light-year is the distance light travels in a year, about 9.5 trillion kilometres. Sunlight is 8 minutes old when it reaches you. Light from the nearest star is 4 years old. The Andromeda galaxy, visible to the naked eye, shows itself as it was 2.5 million years ago. Powerful telescopes see light from over 13 billion years ago — the universe in its infancy.',
 e:'If the Sun vanished right now, you would keep seeing it — and feeling its gravity — for another 8 minutes.',
 f:'The James Webb Space Telescope captures light so old that the galaxies emitting it have since moved, changed and in some cases merged into completely different galaxies.',
 v:[['Light-year','The distance light travels in one year — a unit of distance, not time.'],['Observable universe','The region of space whose light has had time to reach us.']],
 q:[['What is a light-year?',['A year with more daylight','The distance light travels in a year','The time light takes to cross the Sun','A unit of brightness'],1,'It measures distance — about 9.5 trillion km.']]}],

['space_mars_water','Did Mars Once Have Oceans?','A cold, dusty planet — carved by rivers that stopped flowing billions of years ago.','Space','Planetary Science','comfortable',8,['mars','water','planets','life'],['space_light_years','geo_plates','fut_fusion'],{
 s:'Strong evidence says yes: ancient river valleys, lake beds, minerals that only form in water and rounded pebbles all point to a wetter, warmer early Mars that lost most of its water to space.',
 w:'Mars is smaller than Earth, so it cooled quickly and its core stopped generating a strong magnetic field. Without that shield, the solar wind slowly stripped away the atmosphere. Thinner air meant lower pressure and temperature — and liquid water could no longer survive on the surface.',
 h:'Rovers have found clay minerals, sulphates and layered sediments typical of lake floors. Orbiters map delta shapes where rivers met standing water. Isotope measurements show that hydrogen escaped to space, leaving heavier deuterium behind — a chemical fingerprint of lost water. Today, water persists as ice at the poles and underground, and possibly as briny seasonal seeps.',
 e:'The Perseverance rover is exploring Jezero Crater, a dried lake with a clearly visible river delta, collecting samples that may one day return to Earth.',
 f:'Early Mars may have had a northern ocean covering a third of the planet, with water up to 1.6 kilometres deep in places.',
 v:[['Magnetic field','A protective field, generated by a planet\'s molten core, that deflects solar wind.'],['Isotope','A version of an element with a different number of neutrons, useful as a chemical tracer.']],
 q:[['Why did Mars lose most of its atmosphere?',['It was hit by the Moon','Its weak magnetic field let the solar wind strip it away','Volcanoes absorbed it','Plants used it up'],1,'Without a strong magnetic shield, the atmosphere eroded over billions of years.']]}],

['phy_relativity','Why Does Time Run Faster on a Satellite?','Clocks in orbit tick differently from clocks on the ground. Your phone corrects for it every day.','Physics','Relativity','deep',10,['relativity','time','gravity','einstein','gps'],['tech_gps','space_bh','space_orbit'],{
 s:'Time is not universal. It runs slower for objects moving fast and slower in stronger gravity. Satellites experience both effects, and the net result is that their clocks run about 38 microseconds a day ahead of ours.',
 w:'Einstein began with one strange fact: everyone measures the speed of light as the same, no matter how they are moving. For that to be true, space and time themselves must stretch and squeeze depending on motion and gravity. Time dilation is not a clock error — it is time genuinely passing at different rates.',
 h:'Special relativity: a GPS satellite moving at about 14,000 km/h experiences time about 7 microseconds per day slower than us. General relativity: at 20,000 km altitude, Earth\'s gravity is weaker, so the satellite\'s time runs about 45 microseconds per day faster. Net: +38 microseconds. Since light travels 300 metres in a microsecond, ignoring this would put you about 10 kilometres off course each day. Engineers pre-set satellite clocks to tick slightly slow so they match Earth time once in orbit.',
 e:'Two extremely precise atomic clocks, one flown around the world on an airliner and one left on the ground, disagreed on return by exactly the amount Einstein predicted — in 1971.',
 f:'Your head ages very slightly faster than your feet, because it sits in marginally weaker gravity. Over a lifetime the difference is around 90 billionths of a second.',
 v:[['Time dilation','The slowing of time for fast-moving objects or objects in stronger gravity.'],['Special relativity','Einstein\'s theory of motion at constant speed, where the speed of light is constant for everyone.'],['General relativity','Einstein\'s theory of gravity as the curvature of space and time.']],
 q:[['What is the net effect of relativity on GPS satellite clocks?',['They run about 38 microseconds per day fast','They run about 38 microseconds per day slow','They stop','No effect'],0,'Weaker gravity speeds them up more than their speed slows them down.']], pre:['tech_gps']}],

['phy_heat','Why Does Metal Feel Colder Than Wood at the Same Temperature?','Two objects in the same room. Same temperature. One feels icy. Your hand is measuring the wrong thing.','Physics','Thermodynamics','easy',5,['heat','temperature','conduction','senses'],['chem_water','phy_sky_blue'],{
 s:'Your skin does not sense temperature. It senses how fast heat is leaving your body. Metal pulls heat away quickly; wood does not — so metal feels colder even at the same temperature.',
 w:'Metals are full of free electrons that carry energy rapidly from atom to atom. Wood, plastic and fabric trap energy in place. Heat flows from warm to cold, and the speed of that flow is what your nerves report.',
 h:'This property is thermal conductivity. Copper conducts heat about 2,000 times better than wood. When you touch metal at 20°C, your 33°C skin loses heat fast, and receptors fire "cold". Touch wood and heat trickles out slowly — "neutral". The same trick works in reverse: a metal tray in a hot oven burns instantly while the wooden spoon beside it is fine.',
 e:'Tile floors feel freezing on bare feet in the morning while the rug beside them feels warm — even though both have been in the same room all night.',
 f:'Astronauts describe touching objects in shadow on spacewalks as feeling neither hot nor cold through their gloves, because in a vacuum there is almost no conduction — heat only leaves by radiation.',
 v:[['Thermal conductivity','How quickly a material transfers heat.'],['Conduction','Heat transfer through direct contact.']],
 q:[['What does your skin actually detect?',['Absolute temperature','The rate at which heat flows into or out of it','The colour of objects','Air pressure'],1,'Nerves respond to heat flow, which depends on conductivity.']]}],

['phy_sky_blue','Why Is the Sky Blue?','Sunlight is white. The sky is blue. Sunsets are red. One mechanism explains all three.','Physics','Light','easy',5,['light','scattering','colour','atmosphere'],['art_color','phy_heat'],{
 s:'Air molecules scatter short-wavelength blue light far more than long-wavelength red light. Blue bounces all over the sky and reaches your eyes from every direction.',
 w:'White sunlight is a mixture of all colours. Molecules much smaller than a wavelength of light scatter it in proportion to the inverse fourth power of wavelength — so blue, with about half the wavelength of red, scatters roughly ten times as strongly.',
 h:'This is Rayleigh scattering. Looking away from the Sun, you see scattered light — dominated by blue. At sunset, sunlight travels through far more atmosphere; nearly all the blue is scattered out along the way, leaving reds and oranges to reach you directly. Violet scatters even more than blue, but the Sun emits less of it and our eyes are less sensitive to it, so the sky looks blue rather than purple.',
 e:'Distant mountains look bluish and hazy because you are seeing scattered blue light from the air between you and them.',
 f:'On Mars the effect is reversed: dust particles are larger, so the daytime sky is butterscotch and sunsets are blue.',
 v:[['Wavelength','The distance between peaks of a light wave; shorter for blue, longer for red.'],['Rayleigh scattering','Scattering of light by particles much smaller than its wavelength.']],
 q:[['Why are sunsets red?',['The Sun cools down','Blue light is scattered away during the long path through the atmosphere','Dust turns red','Our eyes tire'],1,'Longer paths remove more blue, leaving red to reach you.']]}],

['phy_quantum','What Does "Quantum" Actually Mean?','It is on the labels of everything from physics papers to face creams. Underneath is one deceptively simple idea.','Physics','Quantum','challenge',12,['quantum','physics','uncertainty','particles'],['fut_quantum_computer','neuro_consciousness'],{
 s:'"Quantum" means that at the smallest scales, energy and other properties come in discrete chunks rather than smooth amounts — and that particles behave as spread-out possibilities until they are measured.',
 w:'Classical physics assumed everything could be divided endlessly and that objects always had definite positions. Experiments in the early 1900s broke this. Hot objects glowed with the wrong colours, and light knocked electrons out of metal in ways that only made sense if light came in packets. Nature, it turned out, is grainy.',
 h:'A quantum system is described by a wavefunction — a spread of possibilities with different probabilities. Before measurement, an electron is not "somewhere we don\'t know"; it genuinely lacks a definite position. Measurement yields one outcome, with probabilities the wavefunction predicts perfectly. The famous double-slit experiment shows single particles interfering with themselves like waves. Superposition (many possibilities at once) and entanglement (linked particles sharing a single state) follow from this — and are the basis of quantum computers.',
 e:'Transistors, lasers, LEDs, MRI scanners and solar panels all rely on quantum effects. Your phone works because electrons tunnel through barriers classical physics says are impassable.',
 f:'Quantum mechanics is the most precisely tested theory in science — predictions match experiment to twelve decimal places — yet physicists still disagree about what it says reality is.',
 v:[['Quantum','A discrete unit; the smallest possible amount of something.'],['Superposition','A system existing in several possible states at once until measured.'],['Wavefunction','The mathematical description of a quantum system\'s possibilities.']],
 q:[['What does "quantum" fundamentally refer to?',['Very large things','Discrete chunks of energy and properties at tiny scales','Fast computers','Mystical energy'],1,'Quantisation — nature being grainy at small scales — is the core idea.']], next:['fut_quantum_computer']}],

['chem_maillard','Why Does Toast Taste Better Than Bread?','Same slice. Two minutes of heat. Hundreds of new flavours.','Food Science','Kitchen Chemistry','easy',6,['cooking','maillard','flavour','chemistry'],['food_bread','food_fermentation','chem_rust'],{
 s:'Heat makes sugars and proteins in food react together, creating hundreds of new brown, aromatic compounds. This is the Maillard reaction, and it is responsible for the flavour of toast, seared steak, coffee and roasted anything.',
 w:'Raw ingredients contain simple sugars and amino acids sitting side by side. Above about 140°C, they begin to combine and rearrange into complex molecules — rings and chains that our noses read as nutty, roasted, meaty and savoury. Evolution wired us to like these flavours because they signal cooked, safer, more digestible food.',
 h:'The reaction cascades: early products react again, producing melanoidins (the brown colour) and volatile aroma molecules. It needs a dry, hot surface — which is why wet food steams rather than browns, and why chefs pat meat dry. Above around 180°C, caramelisation of sugars adds more flavour; too far and you reach bitter, burnt carbon.',
 e:'Boiled potatoes are pale and mild. Roast the same potatoes and the surface turns golden and complex. Nothing was added except dry heat.',
 f:'Louis-Camille Maillard described the reaction in 1912 while studying kidney disease — the same chemistry that browns toast also happens slowly inside the human body.',
 v:[['Maillard reaction','A heat-driven reaction between sugars and amino acids that creates browning and flavour.'],['Amino acid','A building block of protein.']],
 q:[['Why does wet food not brown well?',['Water adds sugar','Water keeps the surface below the temperature needed for the reaction','Water is acidic','Wet food has no protein'],1,'The surface must be dry and above roughly 140°C.']]}],

['chem_water','Why Is Water So Weird?','It expands when it freezes, climbs up plants, and dissolves almost anything. No other common liquid behaves like this.','Chemistry','Molecules','comfortable',7,['water','hydrogen bonds','molecules','life'],['phy_heat','env_climate_feedback','chem_gas'],{
 s:'Water molecules are slightly charged at each end and stick to one another with hydrogen bonds. Those weak but plentiful bonds explain nearly all of water\'s strange behaviour.',
 w:'A water molecule is bent, with oxygen hogging electrons. That leaves the oxygen side a little negative and the hydrogen side a little positive. Positive attracts negative, so molecules form fleeting bonds with their neighbours — constantly breaking and re-forming.',
 h:'Hydrogen bonds give water a high boiling point (it should be a gas at room temperature for a molecule its size), high heat capacity (oceans buffer climate), strong surface tension (insects walk on it) and the ability to dissolve salts and sugars. When water freezes, the bonds lock molecules into an open hexagonal lattice that takes up more space than the liquid — so ice floats.',
 e:'Because ice floats, lakes freeze from the top down and fish survive winter underneath. If ice sank, bodies of water would freeze solid from the bottom.',
 f:'Hot water can sometimes freeze faster than cold — the Mpemba effect — and after decades of study, scientists still do not fully agree on why.',
 v:[['Hydrogen bond','A weak attraction between a slightly positive hydrogen and a slightly negative atom nearby.'],['Polar molecule','A molecule with a positive end and a negative end.']],
 q:[['Why does ice float on water?',['Ice contains air','Frozen water forms an open lattice that is less dense than liquid water','Cold things always rise','Ice is a different substance'],1,'Hydrogen bonds lock molecules into a spacious structure.']]}],

['chem_blood','Why Is Blood Red?','Blood is red in your veins too. The blue is a trick of your skin.','Chemistry','Biochemistry','easy',5,['blood','iron','oxygen','colour'],['bio_octo','space_stars_die'],{
 s:'Blood is red because haemoglobin, the protein that carries oxygen, contains iron — and iron bound to oxygen absorbs blue-green light, reflecting red.',
 w:'Each haemoglobin molecule holds four iron atoms, each of which grabs one oxygen molecule. The way iron\'s electrons sit changes which colours the molecule absorbs. Oxygen-rich blood is bright red; oxygen-poor blood is a darker, slightly purplish red — never blue.',
 h:'Veins look blue because of how light penetrates skin. Red light travels deeper and is absorbed by the blood; more blue light scatters back from tissue above the vein than from the surrounding skin, so your brain reads the contrast as blue. Other animals use different metals: octopuses have copper-based blue blood; some marine worms have green blood.',
 e:'A drop of blood from a finger prick is red whether it came from an artery or a vein — the difference is only in shade.',
 f:'An adult body contains enough iron in its blood to make a small nail — around 3 to 4 grams.',
 v:[['Haemoglobin','The iron-containing protein in red blood cells that carries oxygen.'],['Deoxygenated','Blood that has given up its oxygen to tissues.']],
 q:[['Why do veins look blue through the skin?',['Vein blood is blue','More blue light scatters back from skin above the vein than red light does','Veins are painted blue','It is an optical illusion caused by clothes'],1,'It is a light-penetration effect, not blue blood.']]}],

['chem_gas','Why Does Soda Fizz?','Open the bottle and thousands of bubbles appear from nowhere. They were there all along.','Chemistry','Gases','easy',4,['carbon dioxide','pressure','gas','bubbles'],['sci_volcano','chem_water'],{
 s:'Carbon dioxide is forced into the drink under high pressure. Open the cap and the pressure drops, so the gas can no longer stay dissolved and escapes as bubbles.',
 w:'Gases dissolve better under pressure and in cold liquids. Bottling plants pump in CO₂ at several times atmospheric pressure. The sealed bottle keeps it in solution; the hiss when you open it is the pressure equalising.',
 h:'Bubbles need a starting point — a scratch, a speck of dust, a fibre from a towel. That is why bubbles stream from the same spots on a glass. Shaking a bottle mixes gas into tiny bubbles throughout the liquid, giving the CO₂ thousands of escape points at once — hence the eruption. Warm soda goes flat faster because gas is less soluble in warm liquid.',
 e:'Drop a mint into cola and the mint\'s rough surface provides millions of nucleation sites — releasing the gas in one dramatic fountain.',
 f:'The "bite" of fizzy drinks is not just bubbles: CO₂ forms a little carbonic acid in your mouth, which nerve endings detect as a mild sting.',
 v:[['Solubility','How much of a substance can dissolve in a liquid.'],['Nucleation site','A tiny imperfection where bubbles or crystals begin to form.']],
 q:[['Why does a shaken soda erupt when opened?',['Shaking creates more gas','Shaking spreads tiny bubbles that give the gas many escape points at once','The bottle heats up','Shaking removes the sugar'],1,'Extra nucleation sites release dissolved gas all at once.']]}],

['chem_rust','Why Does Iron Rust but Gold Doesn\'t?','A bridge needs repainting every decade. A gold ring from a pharaoh\'s tomb still gleams.','Chemistry','Reactions','comfortable',7,['rust','oxidation','metals','electrons'],['chem_maillard','hist_rome_arch','eng_arch'],{
 s:'Rust is iron giving away electrons to oxygen in the presence of water. Gold holds its electrons so tightly that oxygen cannot take them, so gold never tarnishes.',
 w:'Metals differ in how eagerly they release electrons — their reactivity. Iron sits in the middle: stable enough to use, reactive enough to corrode slowly. Gold is one of the least reactive elements known, which is exactly why it stays shiny and why cultures chose it for treasures.',
 h:'Rusting needs three things: iron, oxygen and water. Water acts as an electrolyte, letting electrons move from iron to oxygen and forming hydrated iron oxide — flaky, orange, and porous, so it does not protect the metal underneath. Aluminium is actually more reactive than iron, but its oxide forms a thin, tight skin that seals the surface. Salt speeds rust by improving the electrolyte, which is why coastal cars suffer.',
 e:'Stainless steel resists rust because added chromium forms an invisible, self-healing oxide layer — the same trick aluminium uses.',
 f:'Iron corrosion costs the world economy an estimated 3–4% of GDP each year — more than most natural disasters combined.',
 v:[['Oxidation','A reaction in which a substance loses electrons, often to oxygen.'],['Electrolyte','A liquid that conducts electricity by allowing charged particles to move.']],
 q:[['What three things are needed for iron to rust?',['Iron, heat and light','Iron, oxygen and water','Iron, salt and gold','Iron, paint and time'],1,'Water allows electron transfer from iron to oxygen.']]}],

['eng_maps','How Do Map Apps Find the Fastest Route?','Millions of possible paths. An answer in under a second. What is the trick?','Technology','Algorithms','comfortable',8,['algorithms','maps','graphs','routing'],['tech_gps','tech_recsys','bio_ant'],{
 s:'Map apps treat roads as a network of points and connections, then use shortest-path algorithms that cleverly avoid checking every possible route.',
 w:'The number of possible routes across a city is astronomically large. Checking them all would take longer than the journey. Instead, algorithms expand outward from your start, always extending the cheapest partial path first — guaranteeing the first complete route found is the best.',
 h:'Dijkstra\'s algorithm (1956) does exactly that. The A* refinement adds a guess of remaining distance so the search leans toward the destination. Real apps pre-compute "highway hierarchies" — shortcuts through major roads — so continental routes take milliseconds. Live traffic data from millions of phones adjusts the cost of each road segment in real time.',
 e:'When traffic builds on a motorway, the app quietly raises the "cost" of that segment. Enough drivers get rerouted that the jam itself eases — the algorithm shapes the traffic it measures.',
 f:'Edsger Dijkstra designed his shortest-path algorithm in about twenty minutes while sitting in a café in Amsterdam, without pen or paper.',
 v:[['Graph','A network of nodes (points) connected by edges (links).'],['Heuristic','A rule of thumb that guides a search toward a likely answer.']],
 q:[['How do routing algorithms avoid checking every possible route?',['They guess randomly','They always extend the cheapest partial path first','They only use motorways','They ask other drivers'],1,'Expanding cheapest-first guarantees optimality without exhaustive search.']]}],

['tech_internet','How Does the Internet Actually Move a Message?','Your message is chopped into pieces, sent along different routes and reassembled — in milliseconds.','Technology','Networks','comfortable',9,['internet','packets','networks','protocols'],['tech_encryption','tech_wifi','eng_maps'],{
 s:'Data is split into small packets, each labelled with a destination address. Routers pass packets hop by hop toward that address, and the receiving device puts them back in order.',
 w:'A single continuous connection per conversation, like an old telephone line, would be fragile and wasteful. Packets let thousands of conversations share the same cables, and if one route fails, packets simply take another.',
 h:'Your device wraps data in layers: the application (a web page), transport (TCP numbers the packets and confirms arrival), internet (IP addresses), and physical link (Wi-Fi, fibre). Each router reads only the IP address and forwards the packet to a neighbour closer to the destination. Undersea fibre cables carry about 99% of intercontinental traffic. DNS translates names like keeploop.app into numeric addresses.',
 e:'Loading one web page can involve hundreds of packets travelling through a dozen routers in several countries — and if a few are lost, TCP quietly asks for them again.',
 f:'The internet\'s packet design was chosen partly because a network with no central hub could survive damage to any single part — which is why it has no "off switch".',
 v:[['Packet','A small chunk of data with addressing information attached.'],['Router','A device that forwards packets toward their destination.'],['IP address','A numeric label identifying a device on a network.']],
 q:[['What does a router do with a packet?',['Reads the message content','Forwards it toward the destination based on its address','Stores it forever','Encrypts it'],1,'Routers read addresses, not content, and pass packets along.']]}],

['tech_encryption','How Can a Message Be Secret When Everyone Can See It?','Your bank details cross the public internet in full view. Yet no one can read them. Here is the mathematical lock.','Technology','Security','deep',10,['encryption','cryptography','privacy','mathematics'],['math_prime','tech_internet','fut_quantum_computer'],{
 s:'Modern encryption uses pairs of keys: one public that anyone can use to lock a message, one private that only the recipient holds to unlock it. The maths makes locking easy and unlocking without the private key practically impossible.',
 w:'Sharing a secret key in advance is impossible with strangers — you cannot whisper to a website. Public-key cryptography, invented in the 1970s, solves this: the lock can be published openly because it does not reveal the key that opens it.',
 h:'Systems like RSA rely on a one-way problem: multiplying two huge prime numbers is instant, but finding those primes from their product would take the fastest computers longer than the age of the universe. Your browser uses public-key exchange to agree a temporary shared key, then switches to faster symmetric encryption for the actual data. The padlock icon means this handshake succeeded.',
 e:'When you connect to a site over HTTPS, your browser and the server agree a secret in plain view of anyone listening — and the eavesdropper still learns nothing.',
 f:'British intelligence mathematicians invented public-key cryptography a few years before the famous academic papers — but their work was classified and stayed secret until 1997.',
 v:[['Public key','A key shared openly that can encrypt messages for its owner.'],['Private key','A secret key that decrypts messages encrypted with the matching public key.'],['One-way function','A calculation easy to do but extremely hard to reverse.']],
 q:[['Why can a public key be shared with everyone?',['It is not really used','Knowing it does not let you work out the private key','Everyone already has it','It changes every second'],1,'The underlying maths is one-way.']], pre:['math_prime']}],

['tech_touchscreen','How Does a Touchscreen Know Where Your Finger Is?','It ignores a pen but responds to a fingertip. It is measuring your body\'s electricity.','Technology','Devices','easy',5,['touchscreen','capacitance','electricity','devices'],['tech_wifi','phy_heat'],{
 s:'Most touchscreens sense the tiny electrical charge of your body. A grid of transparent electrodes detects where that charge disturbs the screen\'s electric field.',
 w:'The human body conducts electricity and can store a small charge. Capacitive screens exploit this: they maintain a uniform electric field, and a conductive fingertip draws a tiny current at the point of contact.',
 h:'Under the glass is a grid of rows and columns of indium tin oxide, a transparent conductor. The controller scans the grid hundreds of times a second, measuring capacitance at each intersection. Touch changes it at specific crossings, pinpointing position — and multiple fingers produce multiple spots, enabling pinch and zoom. Plastic pens, gloves and dry leaves do not conduct, so they are ignored; special gloves weave conductive thread into the fingertips.',
 e:'A screen works with a drop of water on it only poorly — water conducts, so it confuses the grid. That is why phones behave oddly in the rain.',
 f:'The first capacitive touchscreen was built in 1965 for air traffic control in the UK — decades before smartphones.',
 v:[['Capacitance','The ability to store electrical charge.'],['Electrode','A conductor through which electricity enters or leaves.']],
 q:[['Why does a touchscreen ignore a plastic pen?',['The pen is too thin','Plastic does not conduct electricity','Pens are too cold','The screen only sees skin colour'],1,'Only conductive objects disturb the electric field.']]}],

['tech_wifi','How Does Wi-Fi Carry Data Through Air?','Invisible waves are passing through you right now, carrying films, messages and this lesson.','Technology','Wireless','comfortable',7,['wifi','radio','waves','wireless'],['tech_internet','phy_sky_blue'],{
 s:'Wi-Fi turns data into patterns in radio waves — tiny changes in the wave\'s strength, timing and frequency — which your device decodes back into bits.',
 w:'Radio waves are light your eyes cannot see. They pass through walls and air easily, and they can be shaped precisely. By agreeing on rules for how to shape them, devices can send billions of ones and zeros per second without any wire.',
 h:'A router broadcasts on frequencies around 2.4 or 5 gigahertz. Data is encoded by modulating the wave — changing its phase and amplitude in combinations that represent several bits at once. Both sides follow the Wi-Fi standard so they interpret the patterns identically. Walls and water absorb these waves (your body is mostly water), which is why signal drops across rooms. Multiple antennas send different streams simultaneously to multiply speed.',
 e:'A microwave oven uses the same 2.4 GHz frequency at much higher power. Running one can briefly scramble nearby Wi-Fi.',
 f:'The 2.4 GHz band was originally left unlicensed because it was considered junk spectrum — useless for anything except heating food.',
 v:[['Modulation','Changing a wave\'s properties to encode information.'],['Frequency','How many wave cycles pass per second, measured in hertz.']],
 q:[['Why does Wi-Fi weaken across rooms?',['Signals get bored','Walls and water absorb radio waves','Air pressure changes','Routers turn down'],1,'Building materials and bodies absorb the waves.']]}],

['ai_bias','Why Can AI Be Unfair?','A hiring tool learned to reject CVs that mentioned a women\'s college. Nobody programmed it to. So how did it learn?','Artificial Intelligence','Ethics','comfortable',8,['ai','bias','fairness','data','ethics'],['ai_pattern','tech_recsys','law_contract'],{
 s:'AI learns patterns from historical data. If that history contains unfair decisions, the system learns to reproduce them — often more consistently than the humans did.',
 w:'A model does not know what fairness is. It knows what predicted the labels in its training set. If past managers hired fewer women, "signals of being a woman" become signals of "less likely to be hired", and the model dutifully learns them — even if gender itself is removed from the data.',
 h:'Bias enters through what data was collected, who labelled it, what was chosen as the target, and who was under-represented. Facial recognition trained mostly on light-skinned faces performs worse on dark-skinned faces. Proxies leak: postcode can stand in for ethnicity. Fixes include auditing outputs across groups, rebalancing data, and asking whether a decision should be automated at all.',
 e:'A medical risk tool used healthcare spending as a proxy for illness. Because less money had historically been spent on Black patients, the tool underestimated how sick they were.',
 f:'Making a model "blind" to a sensitive attribute often makes bias worse, not better — because you can no longer measure or correct for it.',
 v:[['Training data','The examples a machine learning system learns from.'],['Proxy variable','A feature that indirectly stands in for another, possibly sensitive, feature.']],
 q:[['Where does most AI bias come from?',['Malicious programmers','Patterns in the historical data it learned from','Random errors','Slow computers'],1,'Models reproduce what predicted past outcomes.']], pre:['ai_pattern']}],

['ai_llm','How Do Chatbots Produce Sentences?','It writes poems and code, one word at a time, by predicting what usually comes next.','Artificial Intelligence','Language Models','comfortable',9,['ai','language','llm','prediction'],['ai_pattern','lang_babies','ai_turing'],{
 s:'Large language models are trained to predict the next word in enormous amounts of text. Done at massive scale, next-word prediction produces fluent, knowledgeable-sounding language.',
 w:'To predict the next word well, a model must implicitly learn grammar, facts, style and reasoning patterns — because all of those affect what comes next. The training goal is simple; what it takes to achieve it is not.',
 h:'Text is split into tokens (word pieces). A neural network called a transformer weighs how every token relates to every other via "attention", building a rich representation of context. It outputs a probability for each possible next token; one is chosen, appended, and the process repeats. A later phase of training with human feedback shapes responses to be helpful and safe. The model has no database of facts — knowledge is spread across billions of weights, which is why it can be fluent and wrong at the same time.',
 e:'Ask a chatbot for a source and it may invent a plausible-looking title. It is predicting what a citation usually looks like, not looking one up.',
 f:'The word "hallucination" is used for confident false output — but from the model\'s point of view, every sentence is generated the same way. Truth is not a separate mode.',
 v:[['Token','A chunk of text — often part of a word — that a language model reads and writes.'],['Transformer','The neural network design behind modern language models.'],['Attention','A mechanism that lets the model weigh the relevance of every word to every other.']],
 q:[['What is a language model fundamentally trained to do?',['Look up facts in a database','Predict the next token in text','Translate everything to English','Store conversations'],1,'Next-token prediction at scale produces its abilities — and its errors.']], pre:['ai_pattern']}],

['ai_swarm','Can Simple Robots Be Smart Together?','A thousand tiny robots with no leader arrange themselves into a star shape. Nobody told them how.','Artificial Intelligence','Swarm Intelligence','comfortable',7,['swarm','robots','emergence','ants'],['bio_ant','soc_crowds'],{
 s:'Swarm robotics copies ants and birds: many simple machines following local rules can achieve goals — mapping, building, searching — that no single one understands.',
 w:'A single sophisticated robot is expensive and fragile. A swarm is cheap, scalable and fault-tolerant: lose a hundred units and the task continues. Intelligence lives in the interactions, not the individuals.',
 h:'Each robot senses only its neighbours and follows rules like "keep this distance", "move toward the edge", "signal if you find the target". Global structure emerges from repeated local decisions — the same principle as pheromone trails. Harvard\'s Kilobot project had 1,024 robots self-assemble into shapes; drone swarms use similar rules for light shows and search-and-rescue.',
 e:'Flocking simulations use just three rules — separation, alignment, cohesion — and produce movement indistinguishable from real starling murmurations.',
 f:'Ant-inspired algorithms now route telecom traffic and schedule deliveries. A biological trick 100 million years old runs inside modern logistics software.',
 v:[['Swarm intelligence','Collective problem-solving by many simple agents using local rules.'],['Fault tolerance','A system\'s ability to keep working when parts fail.']],
 q:[['Where does the intelligence of a swarm live?',['In the leader robot','In the interactions between many simple units','In a central computer','Nowhere — swarms are not intelligent'],1,'Emergent behaviour arises from local interactions.']], pre:['bio_ant']}],

['ai_turing','Can a Machine Think?','In 1950 Alan Turing proposed a test. Seventy years on, machines pass versions of it — and the question feels harder, not easier.','Artificial Intelligence','Philosophy of AI','deep',10,['turing','ai','consciousness','philosophy'],['neuro_consciousness','ai_llm','phil_free_will'],{
 s:'Turing sidestepped defining "thinking" and asked instead whether a machine could hold a conversation indistinguishable from a human. Modern AI shows that convincing conversation and genuine understanding may be separate things.',
 w:'"Thinking" is hard to define even for humans. Turing argued that if behaviour is indistinguishable, insisting on an invisible extra ingredient is unfair. Critics like John Searle replied with the Chinese Room: a person following rules to produce perfect Chinese answers without understanding a word.',
 h:'Modern language models produce fluent, context-aware text, yet they have no body, no goals of their own and no verified inner experience. Some researchers argue understanding is a matter of degree and emerges from rich enough patterns. Others hold that grounding in the world, or consciousness itself, is required. Tests have shifted from imitation to capability: can it plan, reason across steps, learn from few examples?',
 e:'People readily attribute feelings to chatbots and even to simple robot vacuums. Our tendency to see minds is strong — which is why the imitation test may measure us as much as the machine.',
 f:'Turing predicted that by the year 2000, machines would fool an average interrogator 30% of the time in a five-minute chat. He was roughly right — about the timing, not about what it would prove.',
 v:[['Turing test','A test of whether a machine\'s conversation is indistinguishable from a human\'s.'],['Chinese Room','A thought experiment arguing that symbol manipulation is not understanding.']],
 q:[['What does the Chinese Room argument claim?',['Chinese is hard to learn','Producing correct outputs by rules does not amount to understanding','Machines cannot speak Chinese','Rooms can think'],1,'Searle argued syntax alone is not semantics.']], pre:['neuro_consciousness']}],

['bio_gene_expression','How Does Gene Expression Work?','Every cell has the same DNA. So how does a skin cell know not to become a neuron?','Biology','Genetics','comfortable',9,['genes','expression','cells','regulation'],['bio_dna','bio_gene_editing','bio_cells_renew'],{
 s:'Gene expression is the process of switching genes on or off. Cells read only the instructions they need, controlled by chemical tags and proteins that open or close regions of DNA.',
 w:'A single instruction set has to build hundreds of cell types and respond to changing conditions. Rather than different DNA, cells use different settings: which genes are active, how strongly, and when. This flexibility is what lets one fertilised egg become an entire body.',
 h:'Proteins called transcription factors bind near a gene and recruit the machinery that copies it into RNA — or block it. DNA is wound around proteins called histones; chemical tags on histones and on DNA itself (methylation) make regions tightly packed and silent or loose and readable. This layer of control is epigenetics. Signals from outside the cell — hormones, nutrients, stress — change these tags, which is how environment reaches the genome without changing its letters.',
 e:'Identical twins share DNA but accumulate different epigenetic tags as they age, which is one reason they grow more different over time.',
 f:'Honeybee queens and workers have identical genes. A larva fed royal jelly switches on the queen programme — diet alone flips the developmental path.',
 v:[['Transcription factor','A protein that switches genes on or off by binding to DNA.'],['Epigenetics','Chemical modifications that change gene activity without changing the DNA sequence.']],
 q:[['What makes a liver cell different from a neuron?',['Different DNA','Different genes switched on','Different number of chromosomes','Neurons have no DNA'],1,'Same genome, different expression pattern.']], pre:['bio_dna'], next:['bio_gene_editing']}],

['bio_gene_editing','How Could Gene Editing Change Evolution?','A bacterial immune system, repurposed as molecular scissors, lets humans rewrite DNA. What happens when edits are inherited?','Biology','Genetics','challenge',12,['crispr','gene editing','evolution','ethics'],['bio_gene_expression','bio_evolution_eye','fut_brain_computer'],{
 s:'Tools like CRISPR let scientists cut DNA at a precise spot and change it. Edits to body cells affect one person; edits to eggs, sperm or embryos are inherited — and could permanently alter a species.',
 w:'Evolution normally changes gene frequencies slowly, through random mutation and selection over generations. Gene editing makes specific, intentional changes in one step. Combined with "gene drives" that force an edit to spread through a population, it can override natural inheritance patterns entirely.',
 h:'CRISPR uses a guide RNA to lead the Cas9 enzyme to a matching DNA sequence, where it cuts. The cell repairs the break, either disabling the gene or copying in a supplied template. In somatic therapy, edited cells treat conditions like sickle-cell disease in one patient. Germline editing changes every cell of a future person and all their descendants. A gene drive rigs inheritance so nearly all offspring carry the edit — proposed to make mosquitoes unable to carry malaria.',
 e:'In 2023 regulators approved the first CRISPR-based therapy, editing patients\' blood stem cells to relieve sickle-cell disease — a lifelong condition altered in a single treatment.',
 f:'CRISPR was discovered as a bacterial defence: bacteria store snippets of viral DNA to recognise and cut invaders. Its use for editing was worked out in 2012 and won a Nobel Prize eight years later.',
 v:[['CRISPR-Cas9','A system that cuts DNA at a location specified by a guide RNA.'],['Germline','Cells — eggs, sperm, embryos — whose DNA is passed to offspring.'],['Gene drive','A genetic mechanism that spreads an edit through a population faster than normal inheritance.']],
 q:[['What distinguishes germline editing from somatic editing?',['Germline edits are temporary','Germline edits are inherited by future generations','Somatic edits use lasers','There is no difference'],1,'Germline changes pass to descendants; somatic changes stay in one person.']], pre:['bio_gene_expression']}],

['bio_evolution_eye','How Did the Eye Evolve?','Half an eye seems useless. Yet eyes evolved independently dozens of times.','Biology','Evolution','comfortable',8,['evolution','eyes','natural selection','adaptation'],['bio_dna','bio_octo','phy_sky_blue'],{
 s:'Eyes evolved through a chain of small, useful steps — from a light-sensitive patch to a cup, a pinhole, a lens — each giving its owner a slight advantage over having less.',
 w:'Natural selection cannot plan ahead, but it does not need to. A patch of cells that detects light helps an animal find shade or dodge shadows. A slightly cupped patch tells direction. Every step from there is an improvement on the last, so there is never a useless "half".',
 h:'Modelling suggests a flat light-sensitive patch can evolve into a fully focused camera eye in well under a million years of gradual change. Living animals show every intermediate stage: flatworms have simple pits, nautiluses have pinhole eyes with no lens, fish and octopuses have lensed camera eyes. The octopus eye evolved separately from ours and is arguably better designed — its light receptors face forward, so it has no blind spot.',
 e:'Compare a nautilus, whose pinhole eye fills with seawater, with a squid\'s sharp lensed eye. Both work; one just works better, and selection keeps what works better.',
 f:'The genes that trigger eye development are so ancient and shared that a mouse eye-control gene inserted into a fruit fly can grow a fly eye on its leg.',
 v:[['Natural selection','The process by which traits that aid survival and reproduction become more common.'],['Intermediate form','A partially developed version of a structure that is still useful.']],
 q:[['Why is "half an eye" not useless?',['Eyes appeared fully formed','Each partial stage still gives a survival advantage','Animals never had half eyes','Half an eye is actually better'],1,'Detecting light at all beats detecting none; direction beats no direction.']]}],

['bio_cells_renew','How Often Is Your Body Replaced?','Your stomach lining is a few days old. Some of your neurons are as old as you are.','Biology','Human Body','easy',6,['cells','renewal','body','ageing'],['phil_ship','bio_gene_expression','sport_muscle'],{
 s:'Different tissues renew at different rates: the gut lining every few days, skin about monthly, red blood cells every four months, bone over a decade — while most neurons and heart muscle cells last a lifetime.',
 w:'Cells in harsh environments — digestive acid, sunlight, friction — wear out fast and must be replaced. Cells that store irreplaceable information or structure, like neurons, are protected instead of replaced.',
 h:'Renewal is driven by stem cells, which divide to produce both new specialised cells and more stem cells. Radioactive carbon from Cold War nuclear tests left a time stamp in human DNA, letting scientists date cells: fat cells are about ten years old on average, heart muscle cells renew at under 1% a year, and cortical neurons are essentially never replaced.',
 e:'A sunburn peels within days because the damaged skin layer is shed and rebuilt by stem cells beneath it.',
 f:'The popular claim that "your whole body is replaced every seven years" is a myth — your eye lenses and much of your brain keep the cells you were born with.',
 v:[['Stem cell','A cell that can divide to make specialised cells and more stem cells.'],['Tissue turnover','The rate at which a tissue replaces its cells.']],
 q:[['Which cells are mostly never replaced?',['Gut lining cells','Red blood cells','Cortical neurons','Skin cells'],2,'Most neurons of the cortex last a lifetime.']]}],

['bio_immune','How Does Your Immune System Remember?','You caught chickenpox once. Decades later, your body still knows the shape of the virus.','Biology','Immunology','comfortable',8,['immune system','vaccines','memory','antibodies'],['bio_dna','bio_cells_renew'],{
 s:'After fighting an infection, the immune system keeps long-lived memory cells that recognise that specific invader. If it returns, the response is faster and stronger — often before you feel ill.',
 w:'The first encounter with a new germ is slow: the body must find the rare cells that happen to match it and multiply them, which takes days. Keeping a stock of matched cells afterwards turns a week-long battle into a same-day victory.',
 h:'B cells make antibodies; T cells coordinate and kill infected cells. Each carries a randomly generated receptor. When one matches an invader, it multiplies enormously. Most of these die after the infection, but a fraction become memory B and T cells that persist for years or decades. Vaccines present a harmless version of the invader\'s shape, building memory without the disease.',
 e:'A booster shot works by re-triggering memory cells, causing a rapid, larger antibody response than the first dose produced.',
 f:'Your body can generate more than a billion different antibody shapes — enough to recognise germs that do not yet exist.',
 v:[['Antibody','A protein that locks onto a specific invader and marks it for destruction.'],['Memory cell','A long-lived immune cell that remembers a past infection.']],
 q:[['Why is a second infection often milder?',['Germs get weaker','Memory cells respond faster and stronger','The body ignores it','Antibodies stay in the blood forever'],1,'Memory B and T cells enable a rapid secondary response.']]}],

['bio_trees_talk','Do Trees Communicate?','Under a forest floor, fungi link roots into a network that trades sugar and sends warnings.','Biology','Ecology','easy',6,['trees','fungi','ecology','networks'],['bio_ant','env_bees','env_climate_feedback'],{
 s:'Trees exchange nutrients and chemical signals through networks of fungi connected to their roots, and release airborne chemicals that neighbours respond to — a slow, chemical form of communication.',
 w:'Trees cannot move, so cooperation and warning through chemistry is one of the few ways they can respond to the world. Fungi gain sugar from the tree; trees gain water, minerals and a connection to neighbours.',
 h:'Fine fungal threads (mycorrhizae) wrap around or enter root tips, forming a shared web. Isotope tracing shows carbon flowing from large "hub" trees to shaded seedlings. When insects attack, some trees release volatile compounds that prompt neighbours to raise their chemical defences. Scientists debate how intentional or extensive this is — the popular "wood wide web" story is likely simplified — but the exchanges are real.',
 e:'Acacia trees browsed by giraffes release ethylene gas; nearby acacias begin producing bitter tannins within minutes, and giraffes move upwind to trees that have not received the warning.',
 f:'A single teaspoon of forest soil can contain several kilometres of fungal threads.',
 v:[['Mycorrhiza','A partnership between a fungus and a plant\'s roots.'],['Volatile compound','A chemical that evaporates easily and can carry signals through air.']],
 q:[['How do trees mainly exchange nutrients with neighbours?',['Through their leaves touching','Through fungal networks connected to their roots','Through the wind','They do not'],1,'Mycorrhizal networks link root systems.']]}],

['hist_silk_road','How Did Ancient Trade Routes Connect the World?','Roman senators wore silk from China they had never seen. Neither had the merchants who sold it.','History','Trade','comfortable',8,['silk road','trade','empires','exchange'],['hist_printing','geo_monsoon','world_supply'],{
 s:'The Silk Road was not one road but a web of routes across Asia along which goods, ideas, religions and diseases moved in relays — no single trader travelled the whole way.',
 w:'Distance and danger made end-to-end journeys impractical. Instead goods passed through many hands, each middleman adding a margin. That relay structure is why silk in Rome cost its weight in gold and why the Romans had only foggy ideas about where it came from.',
 h:'From around the 2nd century BCE, caravans linked Chinese cities with Central Asian oasis towns, Persia and the Mediterranean, while maritime routes crossed the Indian Ocean using monsoon winds. Along with silk, paper, gunpowder, spices and horses travelled Buddhism, Islam, mathematics and — in the 14th century — the plague. The Mongol Empire\'s brief unification of the route made overland travel safer and enabled journeys like Marco Polo\'s.',
 e:'Papermaking reached the Islamic world after a battle in 751 CE, reportedly through captured Chinese craftsmen — and from there reached Europe centuries later.',
 f:'The term "Silk Road" was invented in 1877 by a German geographer. The people who travelled it never called it that.',
 v:[['Relay trade','Trade in which goods pass through many intermediaries between origin and destination.'],['Caravan','A group of travellers and pack animals crossing difficult terrain together.']],
 q:[['Why did few traders travel the whole Silk Road?',['It was illegal','Goods moved in relays through many middlemen','It was too short','Camels refused'],1,'Relay trade spread risk and profit along the route.']]}],

['hist_printing','How Did the Printing Press Change Thinking?','Before 1450, a book cost as much as a house. Fifty years later, Europe had printed 20 million of them.','History','Ideas','easy',7,['printing','books','reformation','information'],['hist_silk_road','lit_story_shape','tech_internet'],{
 s:'Movable-type printing made copying text cheap and exact. It spread literacy, standardised languages, enabled science to build on shared texts, and let ideas escape the control of authorities.',
 w:'When copying was slow and expensive, knowledge was scarce and controlled by those who could afford scribes. Cheap identical copies changed who could read, what they could read and how fast ideas travelled — a shift comparable to the internet.',
 h:'Gutenberg combined metal type, oil-based ink and a modified wine press around 1450. Printers clustered in cities and competed, driving prices down. Martin Luther\'s pamphlets spread across Germany in weeks. Scientists could cite the same page numbers in the same editions, making cumulative knowledge possible. Printed grammars and Bibles froze regional dialects into national languages.',
 e:'Copernicus, Vesalius and later Newton all relied on printed diagrams that copyists would have distorted — accurate images were as revolutionary as accurate words.',
 f:'Printing also produced the first information overload complaints: 16th-century scholars worried that the "confusing and harmful abundance of books" would ruin learning.',
 v:[['Movable type','Individual reusable letters arranged to print a page.'],['Standardisation','Making things uniform — here, spelling, editions and page numbers.']],
 q:[['What made printing so transformative for science?',['Books became prettier','Identical copies let scholars build on the same exact texts and diagrams','Scientists got paid more','Printing invented mathematics'],1,'Shared, exact references enabled cumulative knowledge.']]}],

['hist_plague_econ','How Did the Black Death Raise Wages?','A catastrophe that killed a third of Europe left survivors richer. Scarcity worked in their favour.','History','Economic History','deep',9,['plague','wages','labour','medieval'],['econ_scarcity','hist_silk_road','econ_market'],{
 s:'With so many workers dead, labour became scarce. Landowners had to compete for workers, wages rose, and the old system of tied peasant labour began to crumble.',
 w:'Land stayed the same; people did not. Supply and demand applied to labour just as to grain: fewer hands meant each pair was worth more. Attempts by rulers to freeze wages by law failed because desperate employers quietly paid more anyway.',
 h:'Between 1347 and 1351 the plague killed perhaps 30–50% of Europe\'s population. Real wages in England roughly doubled over the following decades. Peasants moved to better offers; lords converted fields to less labour-intensive sheep farming; diets improved as survivors ate more meat. Some historians link the labour shortage to later investment in labour-saving technology and to the weakening of feudal obligations.',
 e:'England\'s 1351 Statute of Labourers tried to cap wages at pre-plague levels. Court records show it being violated constantly — the market overruled the crown.',
 f:'Archaeological skeleton studies show that people born after the plague were, on average, taller and healthier than those born before it.',
 v:[['Real wage','What wages can actually buy after accounting for prices.'],['Feudalism','A medieval system tying peasants to land and lords.']],
 q:[['Why did wages rise after the Black Death?',['Kings ordered raises','Labour became scarce relative to land','Money lost value','Peasants went on strike'],1,'Scarcity of workers increased their bargaining power.']], pre:['econ_scarcity']}],

['hist_calendar','Why Does the Year Have 365 Days?','A year is actually 365.2422 days long. Fixing that fraction took two thousand years.','History','Timekeeping','easy',6,['calendar','time','astronomy','rome'],['space_orbit','hist_rome_arch'],{
 s:'Earth orbits the Sun in about 365 and a quarter days. Calendars use 365 days and add a leap day every four years — with a few exceptions — to stop the seasons drifting.',
 w:'Farming, festivals and taxes all depend on the seasons, and the seasons follow the Sun. But Earth\'s orbit does not divide neatly into days. Any calendar with whole days must occasionally correct itself, or midsummer slowly slides into winter.',
 h:'Julius Caesar\'s calendar of 45 BCE added a leap day every four years — slightly too many, since the true year is about 11 minutes short of 365.25 days. By 1582 the error had reached 10 days. Pope Gregory XIII deleted them (Thursday 4 October was followed by Friday 15 October) and made century years leap years only if divisible by 400. The Gregorian calendar is now accurate to one day in about 3,000 years.',
 e:'When Britain adopted the Gregorian calendar in 1752, eleven days vanished. George Washington\'s birthday shifted from 11 February to 22 February.',
 f:'Keep Loop\'s 365-day Loop borrows the same idea: a full cycle around the Sun, then the loop begins again — slightly different each time.',
 v:[['Leap year','A year with an extra day to keep the calendar aligned with the seasons.'],['Solar year','The time Earth takes to orbit the Sun once, about 365.2422 days.']],
 q:[['Why are most century years, like 1900, not leap years?',['Popes disliked them','To correct for the Julian calendar adding slightly too many leap days','Because of wars','They are all leap years'],1,'Skipping three century leap days in 400 years matches the true solar year.']]}],

['arch_pompeii','What Did Pompeii Preserve?','A city froze on an ordinary day in 79 CE — bread in ovens, graffiti on walls, a dog on a chain.','Archaeology','Roman World','easy',7,['pompeii','rome','volcano','daily life'],['sci_volcano','hist_rome_arch','arch_dating'],{
 s:'Vesuvius buried Pompeii under metres of ash and pumice within a day, sealing an entire Roman city — buildings, food, art, and the shapes of its people — for 1,700 years.',
 w:'Most ancient sites decay slowly, with later generations rebuilding on top. Pompeii was buried instantly and abandoned, so nothing was reused or overwritten. Ash kept out air and water, preserving organic material that normally vanishes.',
 h:'The eruption first rained pumice for hours, collapsing roofs, then sent superheated surges of gas and ash through the streets. Bodies decayed inside the hardened ash, leaving cavities that 19th-century excavators filled with plaster to reveal poses. Finds include election posters, price lists, carbonised loaves stamped with the baker\'s name and a snack bar with painted menus.',
 e:'Graffiti on Pompeii\'s walls includes complaints about a landlord, love notes and a message reading "I am amazed, wall, that you have not collapsed under the weight of so much scribbling."',
 f:'A loaf of bread from Pompeii, still marked with the slices where it was scored before baking, sits in a museum in Naples — nearly 2,000 years old.',
 v:[['Pyroclastic surge','A fast, superheated cloud of gas and ash from a volcano.'],['Carbonised','Turned to carbon by heat without burning away, preserving shape.']],
 q:[['Why is Pompeii so well preserved compared with other Roman cities?',['It was built of stronger stone','It was buried instantly and never rebuilt on','It was in a desert','Romans preserved it deliberately'],1,'Rapid burial and abandonment protected everything from reuse and decay.']]}],

['arch_dating','How Do We Know How Old Something Is?','A bone, a pot, a tree ring. Each carries a clock — if you know how to read it.','Archaeology','Methods','comfortable',8,['dating','carbon','evidence','methods'],['arch_pompeii','bio_cells_renew','chem_rust'],{
 s:'Archaeologists combine several clocks: radioactive decay in organic material, annual growth rings in trees, layered deposits, and the styles of objects whose dates are already known.',
