<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Keep Loop — Learn something interesting. Every day. 365 days. 365 discoveries. One smarter you.">
<meta name="color-scheme" content="light dark">
<title>Keep Loop — Learn something interesting. Every day.</title>
<style>
/* ============================================================
   KEEP LOOP — DESIGN SYSTEM
   ============================================================ */
:root{
  --bg:#f6f2ec; --bg2:#efe9e0; --card:#fffdf9; --card2:#f7f1e9; --text:#1f1b17; --muted:#6e665c;
  --line:#e6ded2; --line2:#d8cfc2; --accent:#c26a3a; --accent-ink:#ffffff; --accent2:#2f6f6a;
  --accent-soft:#f6e4d6; --accent2-soft:#dcecea; --ok:#3d8b5e; --ok-soft:#dff0e5; --bad:#b9453c; --bad-soft:#f7dedb;
  --warn:#b8862b; --shadow:0 10px 32px rgba(70,45,20,.08); --shadow-sm:0 2px 10px rgba(70,45,20,.06);
  --r:18px; --r-sm:12px; --r-xs:8px;
  --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
  --sidebar:248px; --ease:cubic-bezier(.22,.8,.3,1); --dur:.28s;
}
[data-theme="dark"]{
  --bg:#151412; --bg2:#1c1a18; --card:#221f1c; --card2:#2a2622; --text:#ece7df; --muted:#a2988a;
  --line:#33302b; --line2:#403b34; --accent:#e08a5c; --accent-ink:#1a1512; --accent2:#71b8b1;
  --accent-soft:#3b2a20; --accent2-soft:#1f3532; --ok:#6cc08c; --ok-soft:#1e3327; --bad:#e07a70; --bad-soft:#3a2321;
  --warn:#d9a648; --shadow:0 10px 32px rgba(0,0,0,.4); --shadow-sm:0 2px 10px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;font-size:16px;overflow-x:hidden;min-height:100vh;transition:background var(--dur),color var(--dur)}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent2)}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--bg2);padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;text-decoration:none;color:var(--text)}
.brand .logo-svg{width:34px;height:34px;color:var(--accent2)}
.brand .wordmark{font-weight:800;letter-spacing:.14em;font-size:14px}
.brand .wordmark small{display:block;letter-spacing:0;font-weight:500;color:var(--muted);font-size:11px;margin-top:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;transition:background var(--dur),color var(--dur)}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:var(--card);color:var(--text)}
.nav a.active{background:var(--card);color:var(--text);box-shadow:var(--shadow-sm)}
.nav a.active svg{color:var(--accent)}
.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}
.side-day{margin:10px 12px 14px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.side-day .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.side-day .big{font-family:var(--serif);font-size:22px;margin-top:2px}
.main-col{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .title{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .mobile-brand{display:none;align-items:center;gap:8px}
.topbar .mobile-brand .logo-svg{width:28px;height:28px;color:var(--accent2)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid transparent;transition:all var(--dur)}
.iconbtn:hover{background:var(--card);color:var(--text);border-color:var(--line)}
.iconbtn svg{width:20px;height:20px}
.streak-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.view{padding:28px 28px 90px;max-width:1080px;width:100%;margin:0 auto;animation:fadeUp .35s var(--ease)}
.bottomnav{display:none}

/* ---------- Typography helpers ---------- */
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.eyebrow.accent{color:var(--accent)}
.h-display{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4vw,42px);letter-spacing:-.02em;line-height:1.1}
.h-page{font-family:var(--serif);font-weight:600;font-size:clamp(26px,3.4vw,34px);letter-spacing:-.02em}
.h-section{font-size:18px;font-weight:700}
.lead{color:var(--muted);font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.serif{font-family:var(--serif)}
.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}.mt-4{margin-top:36px}.mt-5{margin-top:56px}
.mb-2{margin-bottom:16px}.mb-3{margin-bottom:24px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.center{text-align:center}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 14px}
.section-head:first-child{margin-top:0}
.link{background:none;border:0;color:var(--accent2);font-weight:600;font-size:14px;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:700;font-size:15px;border:1px solid transparent;transition:transform .15s var(--ease),background var(--dur),box-shadow var(--dur),border-color var(--dur);min-height:44px;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.soft{background:var(--card2);color:var(--text);border-color:var(--line)}
.btn.soft:hover{border-color:var(--line2);background:var(--card)}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn.ghost:hover{color:var(--text);background:var(--card)}
.btn.teal{background:var(--accent2);color:#fff}
.btn.sm{padding:8px 14px;font-size:13px;min-height:36px;border-radius:11px}
.btn.lg{padding:15px 26px;font-size:16px;border-radius:16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn svg{width:18px;height:18px}
.btn.saved{color:var(--accent);border-color:var(--accent)}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow-sm);transition:box-shadow var(--dur),transform var(--dur),border-color var(--dur)}
.card.pad-lg{padding:30px}
.card.flat{box-shadow:none}
.card.hover:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--line2)}
.card.hero{background:linear-gradient(140deg,var(--card) 0%,var(--card2) 100%);position:relative;overflow:hidden}
.card.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%);pointer-events:none}
.card.teal-tint{background:linear-gradient(140deg,var(--card),var(--accent2-soft))}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--card2);border:1px solid var(--line);color:var(--text);white-space:nowrap}
.badge.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.badge.teal{background:var(--accent2-soft);border-color:transparent;color:var(--accent2)}
.badge.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;transition:all .18s var(--ease);min-height:40px}
.chip:hover{border-color:var(--line2);transform:translateY(-1px)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.sm{padding:6px 11px;font-size:13px;min-height:32px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;border:1px solid transparent;transition:all .18s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--text);color:var(--bg)}
.progress{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .6s var(--ease)}
.progress.thin{height:5px}
.stat{padding:18px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line)}
.stat .n{font-family:var(--serif);font-size:30px;line-height:1;margin-bottom:6px}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:600}
.topic-card{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);text-align:left;width:100%;transition:all var(--dur);cursor:pointer;color:var(--text)}
.topic-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--line2)}
.topic-card .tc-title{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.25}
.topic-card .tc-hook{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.topic-card .tc-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.topic-card.done{opacity:.85}
.topic-card.done .tc-title::after{content:" ✓";color:var(--ok)}
.list{display:flex;flex-direction:column;gap:10px}
.list-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line);text-align:left;width:100%;transition:all var(--dur);color:var(--text)}
.list-item:hover{border-color:var(--line2);box-shadow:var(--shadow-sm)}
.list-item .emo{font-size:22px;width:40px;height:40px;border-radius:12px;background:var(--bg2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.list-item .li-title{font-weight:600;font-size:15px}
.list-item .li-sub{font-size:13px;color:var(--muted)}
.list-item .li-right{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.empty{text-align:center;padding:52px 20px;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}
.empty .big{font-family:var(--serif);font-size:22px;color:var(--text);margin-bottom:8px}
.skeleton{position:relative;overflow:hidden;background:var(--bg2);border-radius:10px;min-height:16px}
.skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--card) 70%,transparent),transparent);animation:shimmer 1.4s infinite}
.notice{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.notice::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.input,textarea.input,select.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--text);min-height:46px;transition:border-color var(--dur)}
.input:focus{border-color:var(--accent2);outline:none;box-shadow:0 0 0 3px var(--accent2-soft)}
textarea.input{min-height:120px;resize:vertical;line-height:1.55}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search-wrap .input{padding-left:42px}
.toggle{position:relative;width:46px;height:26px;border-radius:99px;background:var(--line2);transition:background var(--dur);flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform var(--dur);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle[aria-checked="true"]{background:var(--accent2)}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.setting-row .s-title{font-weight:600}
.setting-row .s-sub{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow-sm)}
.bar-row{display:grid;grid-template-columns:150px 1fr 44px;align-items:center;gap:12px;padding:8px 0;font-size:14px}
.bar-row .bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar-row .bar span{display:block;height:100%;background:var(--accent2);border-radius:99px;transition:width .8s var(--ease)}
.bar-row .v{text-align:right;color:var(--muted);font-size:13px}
.divider{height:1px;background:var(--line);margin:28px 0}

/* ---------- Home ---------- */
.home-hero{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:stretch}
.greet{font-family:var(--serif);font-size:clamp(24px,3vw,32px);font-weight:600;letter-spacing:-.02em}
.today-title{font-family:var(--serif);font-size:clamp(26px,3.6vw,40px);font-weight:600;letter-spacing:-.02em;line-height:1.12;margin:12px 0}
.mini-cards{display:grid;gap:12px}
.mini{padding:16px 18px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line)}
.ring{--p:0;width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--bg2) 0);display:grid;place-items:center;flex:none}
.ring::after{content:attr(data-label);width:56px;height:56px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:13px}

/* ---------- Lesson reader ---------- */
.lesson{max-width:720px;margin:0 auto}
.lesson-top{position:sticky;top:69px;z-index:20;margin:-28px -28px 20px;padding:10px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.lesson-top .progress{flex:1}
.lesson-title{font-family:var(--serif);font-size:clamp(30px,5vw,46px);font-weight:600;letter-spacing:-.025em;line-height:1.1;margin:14px 0 16px}
.lesson-hook{font-family:var(--serif);font-size:20px;font-style:italic;color:var(--muted);line-height:1.45}
.lsec{margin-top:44px;scroll-margin-top:130px}
.lsec .eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lsec .eyebrow::after{content:"";height:1px;flex:1;background:var(--line)}
.lsec p{font-size:17.5px;line-height:1.7;margin-bottom:14px;max-width:66ch}
.lsec p:last-child{margin-bottom:0}
.callout{padding:22px 24px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent2)}
.callout.warm{border-left-color:var(--accent);background:linear-gradient(135deg,var(--card),var(--accent-soft))}
.callout.big{font-family:var(--serif);font-size:21px;line-height:1.45}
.callout.big p{font-size:21px;font-family:var(--serif)}
.vocab{display:grid;gap:10px}
.vocab div{padding:14px 18px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line)}
.vocab b{display:block;font-size:16px;margin-bottom:3px}
.vocab span{color:var(--muted);font-size:15px}
.quiz-q{padding:22px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.quiz-q .qt{font-weight:700;font-size:17px;margin-bottom:14px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin-bottom:8px;font-size:15.5px;transition:all .18s;color:var(--text)}
.opt:hover:not([disabled]){border-color:var(--accent2);background:var(--card)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;margin-top:2px;display:grid;place-items:center;font-size:12px;font-weight:800}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .dot{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .dot{border-color:var(--bad);background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.quiz-why{margin-top:10px;padding:14px 16px;border-radius:12px;background:var(--bg2);font-size:15px;animation:fadeUp .3s var(--ease)}
.quiz-why b{display:block;margin-bottom:4px}
.lesson-actions{position:sticky;bottom:0;margin:40px -28px -90px;padding:16px 28px calc(16px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ---------- Completion ---------- */
.complete-wrap{max-width:640px;margin:20px auto;text-align:center}
.check-circle{width:84px;height:84px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 20px;animation:pop .5s var(--ease)}
.check-circle svg{width:40px;height:40px}
.pts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.pts span{padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;animation:fadeUp .5s var(--ease) both}
.pts span:nth-child(2){animation-delay:.12s}.pts span:nth-child(3){animation-delay:.24s}
.feedback-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.feedback-row .chip{flex-direction:column;gap:2px;padding:12px 16px;min-width:88px;font-size:13px}
.feedback-row .chip .e{font-size:22px}

/* ---------- Journey ---------- */
.journey-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.jday{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--muted);transition:transform .15s,box-shadow .15s;position:relative}
.jday.done{background:var(--accent2);border-color:var(--accent2);color:#fff;font-size:14px}
.jday.done.surprise{background:var(--accent);border-color:var(--accent)}
.jday.cur{border:2px solid var(--accent);color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent);font-size:14px}
.jday.missed{background:var(--bg2);color:var(--muted);border-style:dashed}
.jday.future{opacity:.55}
.jday:not(.future):hover{transform:scale(1.12);box-shadow:var(--shadow-sm);z-index:2}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px;border:1px solid var(--line)}
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:grid;grid-template-columns:70px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;color:var(--text)}
.tl-item .tl-day{font-family:var(--serif);font-size:15px;color:var(--muted)}
.tl-item .tl-title{font-weight:600}
.tl-item:hover .tl-title{color:var(--accent2)}

/* ---------- Knowledge map ---------- */
.kmap-wrap{background:radial-gradient(ellipse at 50% 40%,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.kmap-wrap svg{width:100%;height:auto;display:block}
.kmap-wrap .knode{cursor:pointer;transition:opacity .2s}
.kmap-wrap .knode:hover circle{stroke-width:3}
.kmap-wrap .knode text{font-family:var(--font);fill:var(--text);font-weight:600;pointer-events:none}
.kmap-wrap .klink{stroke:var(--line2);stroke-width:1.5;fill:none}
.kmap-wrap .klink.cross{stroke:var(--accent);stroke-dasharray:4 4;opacity:.6}
.kmap-wrap .knode.dim{opacity:.25}
.knode-in{animation:pop .6s var(--ease) both}
.kpanel{padding:20px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}

/* ---------- Achievements ---------- */
.ach{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line)}
.ach .ic{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;font-size:24px;flex:none}
.ach.locked{opacity:.55;filter:grayscale(.6)}
.ach .at{font-weight:700}
.ach .ad{font-size:13px;color:var(--muted)}

/* ---------- Onboarding ---------- */
.ob{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 20% -10%,var(--accent-soft),transparent 60%),radial-gradient(900px 500px at 110% 110%,var(--accent2-soft),transparent 60%),var(--bg)}
.ob-card{width:100%;max-width:640px;animation:fadeUp .5s var(--ease)}
.ob-logo{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:28px}
.ob-logo .logo-svg{width:48px;height:48px;color:var(--accent2);animation:spin 14s linear infinite}
.ob-logo .wordmark{font-weight:800;letter-spacing:.2em;font-size:16px}
.ob-steps{display:flex;gap:6px;justify-content:center;margin-bottom:24px}
.ob-steps i{width:24px;height:4px;border-radius:99px;background:var(--line2)}
.ob-steps i.on{background:var(--accent)}
.ob-title{font-family:var(--serif);font-size:clamp(28px,4.5vw,40px);font-weight:600;letter-spacing:-.02em;line-height:1.12;text-align:center}
.ob-sub{text-align:center;color:var(--muted);margin-top:10px;font-size:17px}
.ob-opts{display:grid;gap:10px;margin-top:24px}
.ob-opt{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;transition:all .18s;color:var(--text)}
.ob-opt:hover{border-color:var(--line2);transform:translateY(-1px)}
.ob-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.ob-opt .e{font-size:22px}
.ob-opt b{display:block;font-size:16px}
.ob-opt span{font-size:13px;color:var(--muted)}
.ob-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:28px}
.ob-hero-lines{text-align:center;font-family:var(--serif);font-size:clamp(34px,6vw,54px);line-height:1.1;letter-spacing:-.025em;font-weight:600}
.ob-hero-lines em{font-style:normal;color:var(--accent)}
.philosophy{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:28px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.philosophy span::after{content:"→";margin-left:8px;color:var(--accent)}
.philosophy span:last-child::after{content:"↻"}

/* ---------- Year review ---------- */
.yr-hero{text-align:center;padding:40px 20px}
.yr-hero .big{font-family:var(--serif);font-size:clamp(40px,8vw,72px);letter-spacing:-.03em;line-height:1;font-weight:600}
.yr-hero .loop-badge{display:inline-block;padding:8px 18px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:800;letter-spacing:.14em;font-size:12px;margin-bottom:24px}
.evolve{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.evolve .arrow{font-size:28px;color:var(--accent)}
.closing{text-align:center;font-family:var(--serif);font-size:clamp(24px,4vw,36px);letter-spacing:-.02em;line-height:1.25}

/* ---------- Toasts / Modals ---------- */
#toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{pointer-events:auto;padding:12px 18px;border-radius:14px;background:var(--text);color:var(--bg);font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:toastIn .35s var(--ease);display:flex;gap:10px;align-items:center;max-width:100%}
.toast.out{animation:toastOut .3s var(--ease) forwards}
.modal-bg{position:fixed;inset:0;background:rgba(20,15,10,.5);z-index:90;display:grid;place-items:center;padding:20px;animation:fade .25s;backdrop-filter:blur(4px)}
.modal{background:var(--card);border-radius:22px;padding:28px;max-width:520px;width:100%;box-shadow:var(--shadow);animation:pop .35s var(--ease);max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal h3{font-family:var(--serif);font-size:24px;margin-bottom:8px}

/* ---------- Animations ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.85)}60%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes shimmer{to{transform:translateX(100%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
@keyframes flame{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.flame-anim{display:inline-block;animation:flame .7s var(--ease) 2}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
[data-motion="reduce"] *,[data-motion="reduce"] *::before,[data-motion="reduce"] *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.view{padding:24px 22px 96px}.lesson-top,.lesson-actions{margin-left:-22px;margin-right:-22px;padding-left:22px;padding-right:22px}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .topbar{padding:12px 16px}
  .topbar .mobile-brand{display:flex}
  .topbar .title{display:none}
  .view{padding:20px 16px 110px}
  .lesson-top{top:61px;margin:-20px -16px 16px;padding:10px 16px}
  .lesson-actions{margin:36px -16px -110px;padding:12px 16px calc(78px + env(safe-area-inset-bottom))}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;min-width:58px;border-radius:12px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none}
  .bottomnav a svg{width:22px;height:22px}
  .bottomnav a.active{color:var(--accent)}
  .home-hero{grid-template-columns:1fr}
  .grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}
  .evolve{grid-template-columns:1fr}
  .evolve .arrow{transform:rotate(90deg);text-align:center}
  .bar-row{grid-template-columns:110px 1fr 40px}
}
@media (max-width:560px){
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .grid-4.stats{grid-template-columns:repeat(2,1fr)}
  .lsec p{font-size:17px}
  .btn{padding:12px 16px}
  .journey-grid{grid-template-columns:repeat(auto-fill,minmax(30px,1fr))}
  .card{padding:18px}
  .card.pad-lg{padding:22px}
}
@media (max-width:380px){.grid-4.stats{grid-template-columns:1fr 1fr}.chip{padding:8px 11px;font-size:13px}}

const RAW_TOPICS = [

['psy_forget','Why Does Your Brain Forget Things?','Have you ever walked into a room and completely forgotten why you came there?','Psychology','Memory','comfortable',8,['memory','forgetting','brain','attention','interference'],['psy_memreal','neuro_sleep_memory','psy_names'],{
 s:'Forgetting is not a failure of the brain. It is mostly the brain deciding, quietly, what is not worth keeping.',
 i:'We tend to imagine memory as a hard drive: information goes in, sits there, and should come back out on request. But memory is a living process. A memory is a pattern of connections between brain cells, and patterns that are not used tend to fade. Meanwhile new memories compete with old ones for the same space.',
 w:'Your brain receives a flood of information every second — the temperature of the room, the texture of your chair, background noise. If it kept all of it, finding anything useful would be impossible. So it prioritises. Things you pay attention to, things that carry emotion, and things you repeat are marked as important. Everything else is allowed to weaken.',
 h:'Three processes explain most forgetting. First, decay: connections that are not reactivated grow weaker over time. Second, interference: similar memories blur into each other, like two songs with the same tune. Third, retrieval failure: the memory is still there, but you cannot find the path to it — which is why a smell or a song can suddenly bring it back. The "doorway effect" is retrieval failure: walking through a door tells your brain a scene has ended, and it files away the goal you were holding.',
 e:'You meet five people at a party and hear five names. An hour later you remember one — the person who made you laugh. Emotion and attention marked that name as worth keeping. The other four were never given a strong enough trace to survive.',
 a:'Think of a forest with many paths. Paths that are walked often stay clear. Paths nobody uses slowly grow over — not because someone removed them, but because nothing kept them open. Remembering is walking the path again.',
 f:'People with almost perfect autobiographical memory often describe it as exhausting rather than useful. Forgetting old phone numbers, old hurts and irrelevant details is part of what lets you think clearly today.',
 m:'If forgetting is normal, you can stop blaming yourself and start working with your brain: pay real attention when something matters, connect it to something you already know, and revisit it after a day or two. Those three habits do more than any memory trick.',
 k:'Forgetting is the brain filtering, not failing. Attention, emotion and repetition decide what stays.',
 v:[['Recall','Bringing a stored memory back into your mind.'],['Interference','When similar memories compete and make each other harder to retrieve.'],['Consolidation','The process, largely during sleep, that makes new memories more stable.'],['Retrieval cue','A trigger — a smell, a place, a word — that helps you find a memory.']],
 q:[['What is one main reason people forget information?',['The brain deletes everything after a few hours','Memories can weaken or interfere with each other','Humans cannot store long-term memories','Forgetting only happens with age'],1,'Memories fade when unused and can blur together when they are similar. That is normal, healthy filtering.'],
    ['Why do you sometimes forget why you walked into a room?',['Your brain is running out of storage','The doorway signals a scene change and your goal gets filed away','Rooms contain distracting colours','You never actually had a goal'],1,'This is the "doorway effect" — an example of retrieval failure, not lost information.'],
    ['Which habit most helps a memory survive?',['Reading it once very quickly','Connecting it to something you already know and revisiting it later','Trying not to think about it','Writing it in capital letters'],1,'Meaningful connection plus spaced revisiting strengthens the trace.']],
