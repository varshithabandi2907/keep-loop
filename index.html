 w:'No single method works everywhere. Radiocarbon covers only about 50,000 years and only living things; tree rings need wood; layers can be disturbed. Cross-checking methods against each other is what makes dates trustworthy.',
 h:'Living things absorb carbon-14 from the air; when they die, it decays at a known rate, halving every 5,730 years. Measuring what remains gives an age, calibrated against tree-ring records that stretch back over 12,000 years. For older material, other isotopes such as potassium-argon date volcanic layers around fossils. Thermoluminescence dates when pottery was last fired. Stratigraphy — deeper is older — provides relative order.',
 e:'The Shroud of Turin was radiocarbon dated by three labs in 1988 to between 1260 and 1390 CE — centuries after the period it was claimed to be from.',
 f:'Nuclear bomb tests in the 1950s doubled atmospheric carbon-14, creating a spike that lets scientists date anything that grew since — including human cells and elephant ivory.',
 v:[['Half-life','The time for half of a radioactive substance to decay.'],['Stratigraphy','Reading the order of layers to establish relative age.']],
 q:[['What does radiocarbon dating require?',['Metal objects','Material that was once living','Pottery only','Written records'],1,'Only living things take up carbon-14.']]}],

['geo_plates','Why Do Continents Move?','South America and Africa fit like puzzle pieces. They were once joined — and are still drifting apart.','Geography','Earth Science','easy',7,['plate tectonics','continents','earthquakes','earth'],['sci_volcano','geo_currents','space_mars_water'],{
 s:'Earth\'s outer shell is broken into plates that float on hot, slowly flowing rock beneath. Heat from the planet\'s interior keeps that rock circulating, dragging the plates a few centimetres a year.',
 w:'Earth\'s core is still hot from its formation and from radioactive decay. Heat has to escape, and it does so by convection: hot rock rises, cools near the surface, and sinks — a mantle "conveyor" that moves the crust riding on top.',
 h:'Plates pull apart at mid-ocean ridges, where new crust forms; they collide at subduction zones, where one dives beneath the other, raising mountains and feeding volcanoes; and they slide past each other along faults, causing earthquakes. The theory was resisted until the 1960s, when seafloor magnetic stripes proved new crust was being created symmetrically at ridges.',
 e:'The Atlantic widens by about 2.5 centimetres a year — roughly the speed your fingernails grow. Over the age of the Atlantic, that adds up to an ocean.',
 f:'The Himalayas are still rising as India pushes into Asia, and Mount Everest grows about 4 millimetres taller each year.',
 v:[['Plate tectonics','The theory that Earth\'s surface is made of moving plates.'],['Subduction','One plate sliding beneath another into the mantle.']],
 q:[['What drives the movement of tectonic plates?',['Ocean currents','Convection of hot rock in the mantle','The Moon\'s gravity','Wind'],1,'Heat escaping from Earth\'s interior circulates the mantle.']]}],

['geo_monsoon','What Causes a Monsoon?','Half the world\'s population waits for the same seasonal rains. What flips the switch?','Geography','Climate','comfortable',7,['monsoon','climate','wind','asia'],['geo_currents','hist_silk_road','env_climate_feedback'],{
 s:'A monsoon is a seasonal reversal of wind. In summer, land heats faster than sea, rising air pulls moist ocean air inland, and it rains for months. In winter the pattern flips.',
 w:'Land warms and cools quickly; the ocean changes slowly. That temperature difference creates pressure differences, and air flows from high to low pressure. Big continents next to warm oceans — South Asia especially — produce the strongest version.',
 h:'By June, the Indian subcontinent is far hotter than the Indian Ocean. Hot air rises, creating low pressure that draws in humid ocean winds from the south-west. When that air hits the Himalayas and the Western Ghats it is forced upward, cools and dumps its moisture. In winter the land cools, high pressure forms, and dry winds blow outward toward the sea.',
 e:'Cherrapunji in north-east India receives around 11 metres of rain a year — most of it in the four monsoon months.',
 f:'Ancient sailors timed voyages by the monsoon: outward to India on the summer south-westerlies, home to Arabia on the winter north-easterlies.',
 v:[['Monsoon','A seasonal reversal of prevailing winds bringing wet and dry seasons.'],['Orographic rain','Rain caused when air is forced upward over mountains.']],
 q:[['Why does the summer monsoon bring rain?',['The sea heats faster than land','Hot rising air over land draws moist ocean air inland','Mountains melt','Winds stop'],1,'Land–sea temperature contrast drives moist inflow.']]}],

['econ_inflation','Why Do Prices Keep Rising?','Your grandparents bought a house for what a car costs now. The house did not change. The money did.','Economics','Macroeconomics','comfortable',8,['inflation','money','prices','central banks'],['econ_scarcity','fin_inflation_money','fin_compound'],{
 s:'Inflation is a general rise in prices — or equivalently, a fall in what each unit of money buys. It happens when spending grows faster than the supply of goods, or when costs of production rise across the economy.',
 w:'Prices are set by the balance of money chasing goods. More money or more eager spending with the same goods pushes prices up ("demand-pull"). Higher costs — energy, wages, supply shocks — push prices up from the other side ("cost-push"). Expectations matter too: if everyone expects prices to rise, they raise them.',
 h:'Central banks target low, steady inflation (usually about 2%) because mild inflation keeps the economy flexible, while deflation makes people delay purchases. They raise interest rates to cool spending and lower them to encourage it. Hyperinflations — Germany 1923, Zimbabwe 2008 — happened when governments printed money to pay bills, and trust in the currency collapsed.',
 e:'After 2020, supply chains were disrupted while governments supported spending. Too much money met too few goods, and inflation jumped worldwide.',
 f:'At 2% inflation, prices double roughly every 35 years — the Rule of 72 again, but working against your savings.',
 v:[['Inflation','A sustained rise in the general level of prices.'],['Interest rate','The cost of borrowing money; the central bank\'s main lever.'],['Purchasing power','How much a unit of money can buy.']],
 q:[['Why do central banks raise interest rates during high inflation?',['To make banks richer','To cool spending and reduce upward pressure on prices','To increase prices','Because of tradition'],1,'Higher rates reduce borrowing and spending.']], pre:['econ_scarcity']}],

['econ_market','How Do Markets Set Prices Without a Planner?','No one decides how many pencils a city needs. Somehow, there are always pencils.','Economics','Markets','comfortable',8,['markets','prices','information','coordination'],['bio_ant','econ_scarcity','hist_plague_econ'],{
 s:'Prices act as signals. When something becomes scarce, its price rises, telling producers to make more and buyers to use less — coordinating millions of people who never speak to each other.',
 w:'No central planner could gather all the information — local shortages, changing tastes, new techniques — fast enough. A price compresses all of that into a single number everyone can react to. Like ant trails, order emerges from local responses.',
 h:'Economist Friedrich Hayek described prices as a "system of telecommunications". When a tin mine closes, tin buyers do not need to know why; the higher price alone makes them economise and makes other mines expand. Markets fail when prices miss costs (pollution), when information is hidden (used cars) or when one seller controls supply — which is why regulation exists alongside markets.',
 e:'No single person knows how to make a pencil from scratch — the wood, graphite, rubber, paint and metal come from dozens of countries, coordinated entirely by prices.',
 f:'Soviet planners once tried to set prices for roughly 24 million products centrally. Shortages of some goods and mountains of unwanted others were the result.',
 v:[['Price signal','Information conveyed by a price change about scarcity or demand.'],['Market failure','A situation where prices fail to reflect true costs or benefits.']],
 q:[['What does a rising price "tell" producers?',['To stop producing','To produce more of that good','To lower quality','Nothing'],1,'Higher prices signal scarcity and reward extra supply.']], pre:['econ_scarcity']}],

['econ_tragedy_commons','Why Do Shared Resources Get Overused?','Everyone knows overfishing is bad. Every boat keeps fishing. Both facts are rational.','Economics','Game Theory','comfortable',7,['commons','incentives','cooperation','environment'],['env_bees','env_climate_feedback','econ_market'],{
 s:'When a resource is shared and nobody owns it, each user gains the full benefit of taking more while the cost is spread across everyone. Individually sensible choices add up to collective ruin.',
 w:'The maths of incentives is against restraint: if you hold back, others take what you left, and the resource collapses anyway. Without rules, trust or ownership, the only stable strategy is to take as much as you can, as fast as you can.',
 h:'Ecologist Garrett Hardin named the "tragedy of the commons" in 1968 using the image of shared grazing land. Solutions include private property, government quotas, and — as Elinor Ostrom showed, winning a Nobel Prize — community-managed rules with monitoring and graduated punishment, which have sustained fisheries and forests for centuries.',
 e:'Atlantic cod off Newfoundland supported fishing for 500 years. By 1992 the stock had collapsed by 99% and the fishery closed, putting 30,000 people out of work.',
 f:'Ostrom found that communities from Swiss alpine villages to Philippine irrigation networks solved the commons problem without either privatisation or central government.',
 v:[['Commons','A resource shared by a group without individual ownership.'],['Incentive','Something that motivates a particular choice.']],
 q:[['Why do individuals overuse a commons even when they know it is harmful?',['They are irrational','They receive the full benefit while sharing the cost','They enjoy destruction','They do not know'],1,'The incentive structure rewards taking more.']]}],

['biz_pricing','Why Does 9.99 Work?','One cent less. Measurably more sales. Your brain reads numbers from the left.','Business','Marketing','easy',5,['pricing','psychology','marketing','numbers'],['econ_scarcity','psy_loss_aversion','biz_network'],{
 s:'Prices ending in .99 work because we process the leftmost digit first and anchor on it. 9.99 registers as "nine-something" before the rest is read.',
 w:'Reading is fast and lazy. The first digit sets an impression that later digits only partially adjust. Marketers also learned that .99 signals "discounted" while round numbers signal "quality" — which is why luxury brands avoid the trick.',
 h:'Studies show demand can rise noticeably when a price drops from 10.00 to 9.99, but barely changes from 9.99 to 9.98. Other tactics: anchoring (showing a higher "was" price), decoys (a mid-option that makes the expensive one look reasonable), and removing currency symbols on menus to reduce "payment pain".',
 e:'A restaurant listing a very expensive bottle of wine rarely sells it — but it makes the second-most expensive bottle look sensible, and sales of that one rise.',
 f:'The .99 ending may have begun as an anti-theft measure: forcing cashiers to open the till for change created a record of every sale.',
 v:[['Anchoring','Relying heavily on the first number seen when judging value.'],['Decoy effect','Adding an option that makes another option look more attractive.']],
 q:[['Why does 9.99 feel cheaper than 10.00?',['It is much cheaper','We anchor on the leftmost digit','Tax is lower','Shops round down'],1,'Left-digit processing shapes the impression.']]}],

['biz_network','Why Do Some Apps Win Everything?','A slightly better product loses to one with more users. Value comes from the crowd, not the code.','Business','Strategy','comfortable',7,['network effects','platforms','strategy','technology'],['tech_recsys','soc_status','biz_pricing'],{
 s:'Network effects mean a product becomes more valuable as more people use it. A phone network with one user is useless; with everyone, it is essential — and the leader becomes very hard to displace.',
 w:'When value depends on other users, being big is itself the product. New users choose the network where their friends already are, which makes it bigger, which attracts more users. Small early leads compound into dominance.',
 h:'Direct network effects (messaging apps) grow with users of the same kind; indirect ones (app stores, marketplaces) grow with two groups attracting each other. Switching costs and data advantages reinforce the lock-in. Challengers succeed by targeting a niche (a campus, a city) where they can reach critical mass locally, or by riding a platform shift like mobile.',
 e:'Facebook launched at a single university, reached near-total adoption there, then expanded campus by campus — winning many small networks instead of one big one.',
 f:'The fax machine is the classic example: the first one ever sold was worthless until the second one existed.',
 v:[['Network effect','When each new user increases the value of a product for all users.'],['Critical mass','The point at which a network becomes self-sustaining.']],
 q:[['Why is a dominant messaging app hard to displace?',['Its code is secret','Its value comes from everyone already being on it','It is cheaper','It has better colours'],1,'Network effects make size itself the product.']]}],

['biz_brand_trust','What Is a Brand, Really?','You pay more for a logo. But you are not really buying the logo.','Business','Branding','easy',6,['brand','trust','marketing','psychology'],['psy_halo','biz_pricing','psy_firstimp'],{
 s:'A brand is a shortcut for trust. It is a stored expectation of quality and identity, built over time, that lets people decide quickly without checking everything.',
 w:'Checking every purchase would be exhausting. A brand compresses past experience — yours and other people\'s — into a name and symbol. Companies invest in brands because trust that saves customers effort earns a premium price.',
 h:'Brands work through consistency: the same experience every time builds a reliable expectation. They borrow the halo effect (associating with admired people) and identity (telling customers who they are). Blind taste tests often show people cannot distinguish brands — yet brain scans show the brand label changes the experience of taste itself.',
 e:'When cola is tasted blind, preferences split. When the labels are shown, the famous brand wins decisively — and the brain\'s memory and reward regions light up differently.',
 f:'The word "brand" comes from burning a mark onto cattle to show ownership — a promise about origin, which is still what a brand does.',
 v:[['Brand equity','The added value a recognised brand gives a product.'],['Consistency','Delivering the same experience reliably, the foundation of trust.']],
 q:[['What does a brand primarily save a customer?',['Money','The effort of evaluating quality each time','Time queuing','Storage space'],1,'Brands are trust shortcuts.']]}],

['fin_inflation_money','Where Does Money Come From?','Most money is not printed. It is typed into existence by banks when they make loans.','Finance','Money','deep',10,['money','banks','credit','economy'],['econ_inflation','fin_compound','econ_market'],{
 s:'Only a small share of money is physical cash. The rest is created when commercial banks make loans: the loan appears as a new deposit in the borrower\'s account, and that deposit is money.',
 w:'Money is fundamentally a trusted record of who owes what. Banks are licensed to create such records. When a bank lends you 200,000 for a house, it does not hand over someone else\'s savings — it credits your account and records a matching debt. Both sides of its ledger grow.',
 h:'Central banks influence this by setting interest rates and rules on how much capital banks must hold. They also create "reserve" money used between banks. When loans are repaid, that money disappears again. Governments spending more than they tax borrow by issuing bonds. Trust holds the whole system together — which is why bank runs are dangerous and why deposit insurance exists.',
 e:'In the UK, around 97% of money in circulation is bank deposits created through lending; only about 3% is notes and coins.',
 f:'The Bank of England published a paper in 2014 explaining that textbooks had money creation backwards: loans create deposits, not the other way round.',
 v:[['Commercial bank','A bank that takes deposits and makes loans to the public.'],['Reserves','Money held by banks at the central bank for settling payments.'],['Ledger','A record of accounts — debts and credits.']],
 q:[['What happens when a bank makes a loan?',['It hands over existing savings','It creates a new deposit — new money — in the borrower\'s account','It prints notes','It borrows from the government'],1,'Loans create deposits.']], pre:['econ_inflation']}],

['fin_diversify','Why Not Put All Your Eggs in One Basket?','The one free lunch in finance: reducing risk without reducing expected return.','Finance','Investing','easy',6,['investing','risk','diversification','portfolio'],['fin_compound','psy_loss_aversion','math_probability'],{
 s:'Diversification spreads money across investments that do not all move together. When one falls, others may hold or rise, so the overall ride is smoother without giving up long-term growth.',
 w:'Any single company can fail for reasons no one predicts. But the whole economy rarely fails at once. Holding many uncorrelated assets means bad luck in one place is offset elsewhere — mathematically, the swings cancel partially while the average return stays.',
 h:'Risk comes in two kinds: specific (this company\'s CEO resigns) and systematic (a recession hits everyone). Diversification removes most specific risk; it cannot remove systematic risk. Index funds hold hundreds or thousands of companies cheaply, which is why they are the default advice. Correlation matters more than count: ten airline stocks are barely diversified.',
 e:'Employees who held most of their retirement savings in their own company\'s shares lost both job and savings when firms like Enron collapsed.',
 f:'Harry Markowitz, who formalised diversification mathematically in 1952, admitted he split his own pension 50/50 between stocks and bonds "to minimise future regret" rather than following his own formulas.',
 v:[['Diversification','Spreading investments to reduce exposure to any single risk.'],['Correlation','How closely two things move together.']],
 q:[['What kind of risk does diversification mostly remove?',['Risk of recession','Risk specific to individual companies','All risk','Inflation risk'],1,'Specific risk cancels out; systematic risk remains.']]}],

['art_perspective','How Did Painters Learn to Show Depth?','For a thousand years, paintings looked flat. Then one architect held up a mirror in Florence.','Art','Art History','easy',6,['perspective','renaissance','geometry','painting'],['math_probability','hist_printing','art_color'],{
 s:'Linear perspective is a geometric system in which parallel lines converge at a vanishing point on the horizon. It was worked out around 1415 and gave Western painting a convincing illusion of three dimensions.',
 w:'The eye sees the world as if projected onto a flat window. Objects further away look smaller in a precise, predictable way. Once artists understood the rule, they could construct space on canvas rather than approximate it.',
 h:'Filippo Brunelleschi demonstrated it by painting the Florence Baptistery on a panel with a peephole and viewing it through a mirror — the painting matched the real building exactly. Alberti wrote the rules down in 1435. Painters then drew a horizon line, chose vanishing points, and scaled every tile, column and figure by geometry. The result was Renaissance space: Masaccio\'s Trinity and Leonardo\'s Last Supper.',
 e:'Stand at the end of a long corridor and notice how the floor lines rush toward a single point ahead of you. That point is what Brunelleschi captured.',
 f:'Many cultures deliberately avoided linear perspective. Chinese landscape scrolls use shifting viewpoints so the viewer "travels" through the scene rather than standing in one spot.',
 v:[['Vanishing point','The point where parallel lines appear to meet.'],['Horizon line','The eye-level line across a picture where vanishing points sit.']],
 q:[['What is a vanishing point?',['A hidden signature','Where parallel lines appear to converge','The edge of a canvas','A type of paint'],1,'It anchors the geometry of perspective.']]}],

['art_color','Why Do Some Colours Feel Warm?','Red advances, blue recedes. Physics and culture both have a hand in it.','Art','Colour Theory','easy',5,['colour','perception','design','emotion'],['phy_sky_blue','art_perspective','neuro_amygdala'],{
 s:'Warm colours are linked to fire, sun and skin; cool colours to sky, water and distance. Our eyes also focus red and blue wavelengths slightly differently, making reds seem closer.',
 w:'Association does most of the work: a lifetime of warm things being red-orange and cool things being blue trains a reflex. But there is optics too — the eye\'s lens bends short blue wavelengths more, so pure red and pure blue at the same distance focus at slightly different depths.',
 h:'Artists exploit this: warm foregrounds and cool backgrounds increase apparent depth (atmospheric perspective, since distant air scatters blue). Designers use warm colours for calls to action and cool colours for calm. Culture modifies the rules — white means purity in some places and mourning in others — but warm/cool distinctions appear across most cultures.',
 e:'Restaurants often use reds and oranges to feel lively and to encourage faster turnover; spas use blues and greens to slow people down.',
 f:'Until the 20th century, blue was often considered a warm, feminine colour and pink a strong, masculine one in parts of Europe.',
 v:[['Atmospheric perspective','Distant objects appearing bluer and paler because of air scattering.'],['Colour temperature','The perceived warmth or coolness of a colour.']],
 q:[['Why do distant hills look blue?',['They are painted','Air scatters blue light between you and them','Hills are cold','Your eyes tire'],1,'Atmospheric scattering adds blue to distant scenes.']]}],

['mus_math','Why Do Some Notes Sound Good Together?','Pythagoras heard it in a blacksmith\'s hammers: harmony is arithmetic.','Music','Music Theory','comfortable',8,['harmony','mathematics','frequency','sound'],['mus_goose','mus_minor','phy_quantum'],{
 s:'Notes sound harmonious when their frequencies form simple ratios — 2:1 for an octave, 3:2 for a fifth. Simple ratios mean the sound waves line up regularly, which the ear finds smooth.',
 w:'A vibrating string produces not just one frequency but a series of overtones at whole-number multiples. When two notes share many overtones, they blend; when their overtones clash, the ear hears roughness. Simple ratios maximise shared overtones.',
 h:'An octave (2:1) shares every overtone. A fifth (3:2) shares many. A major third (5:4) fewer, and a minor second (16:15) almost none — which is why it sounds tense. Western tuning compromises slightly (equal temperament) so instruments can play in every key, which is why a piano\'s fifths are very slightly out of tune. Different cultures build scales from different ratio choices, yet the octave is nearly universal.',
 e:'Sing a note and have someone sing the same note an octave higher. Most people hear them as "the same note" — because the frequencies match exactly 2:1.',
 f:'The 12-note scale exists because raising a note by twelve fifths lands almost exactly seven octaves up. The tiny gap left over is called the Pythagorean comma.',
 v:[['Frequency','How many times a sound wave vibrates per second, determining pitch.'],['Overtone','A higher frequency produced along with a note\'s fundamental.'],['Octave','The interval between a note and one with double its frequency.']],
 q:[['Why does an octave sound so consonant?',['It is the loudest interval','The frequencies are in a 2:1 ratio, so all overtones align','It is used in pop music','It has no frequency'],1,'Perfect alignment of overtones produces smoothness.']]}],

['mus_earworm','Why Do Songs Get Stuck in Your Head?','It has been three days. You do not even like the song.','Music','Music Psychology','easy',5,['earworm','memory','music','brain'],['mus_goose','psy_forget','neuro_habits'],{
 s:'Earworms are the brain\'s auditory memory replaying a fragment that is simple, repetitive and slightly unresolved. It loops because your mind keeps trying to "complete" it.',
 w:'Music engages memory, emotion and motor planning at once, making it unusually sticky. A chorus with a catchy rhythm and a small unexpected twist is easy to store and easy to trigger — by a word, a rhythm or a stray thought.',
 h:'Studies find earworms most often occur during low-attention tasks, when the mind wanders. Songs with simple, repetitive melodies and unusual intervals are most likely to stick. The loop is an "open task" — the brain dislikes unfinished patterns. Effective cures: listen to the whole song to give it closure, or do a moderately demanding task like a puzzle that occupies working memory.',
 e:'Chewing gum reduces earworms. It occupies the same articulatory circuits the brain uses to silently "sing".',
 f:'Around 90% of people experience earworms at least once a week — and musicians get them more often, not less.',
 v:[['Involuntary musical imagery','The scientific name for an earworm.'],['Zeigarnik effect','The tendency to remember unfinished tasks better than finished ones.']],
 q:[['What is one evidence-based way to stop an earworm?',['Hum louder','Listen to the whole song to give it closure','Sleep less','Ignore all music'],1,'Completing the pattern often closes the loop.']]}],

['mus_minor','Why Does a Minor Key Sound Sad?','Change one note by a semitone, and a birthday song becomes a funeral march.','Music','Music Psychology','comfortable',7,['minor key','emotion','music','culture'],['mus_math','mus_goose','lang_babies'],{
 s:'Minor keys sound sad partly because they resemble the falling, low-energy pitch patterns of sad speech, and partly because Western culture has paired them with sad contexts for centuries.',
 w:'Humans read emotion in voices: sad speech is quieter, slower, and uses smaller, downward pitch movements. Minor intervals are slightly "flatter" versions of major ones, mimicking those patterns. On top of that, every film, lullaby and hymn you have heard reinforces the association.',
 h:'The key difference is the third note: a major third is a 5:4 ratio, a minor third 6:5 — a slightly less consonant, lower interval. Studies of speech show that people speaking sadly produce more minor-third-like intervals. But culture shapes the rest: some traditions use minor-sounding scales for dancing and celebration, and children under about six do not reliably hear minor as sad.',
 e:'"Happy Birthday" in a minor key sounds instantly mournful — even though the rhythm, words and melody shape are unchanged.',
 f:'Bulgarian, Greek and Balkan folk dance music often uses minor and modal scales for joyful, fast dances, which sound melancholy to unfamiliar Western ears.',
 v:[['Minor third','An interval slightly smaller than a major third, central to minor keys.'],['Prosody','The rhythm and melody of speech that conveys emotion.']],
 q:[['Why do children under six not reliably hear minor keys as sad?',['They cannot hear music','The association is partly learned from culture','Their ears are smaller','Minor keys are not sad'],1,'The emotional meaning is partly cultural conditioning.']], pre:['mus_math']}],

['film_cuts','Why Don\'t We Notice Film Cuts?','A film changes camera angle every few seconds. Your brain stitches it into a single scene without complaint.','Film','Film Craft','easy',6,['editing','perception','attention','film'],['neuro_attention','psy_memreal'],{
 s:'Editors hide cuts at moments when your attention naturally jumps — a movement, a glance, a sound — and your visual system, which already blanks out during every eye movement, fills the gap.',
 w:'Your eyes make several jumps (saccades) every second, and during each jump vision is suppressed. You never see the smear, yet the world feels continuous. Film editing borrows this: if a cut happens where the brain would have "blinked" anyway, it goes unnoticed.',
 h:'Continuity editing uses rules: cut on action (mid-movement), match eyelines, keep the camera on one side of a line so characters do not swap places, and cut just after a viewer\'s attention shifts to a new point of interest. Studies tracking viewers\' blinks show audiences blink in sync at cuts — the brain treats them as natural breaks in attention.',
 e:'A character reaches for a door handle; cut to the other side as the door opens. Two shots, filmed hours apart, feel like one motion.',
 f:'When early audiences saw a cut in the 1900s, some found it disorienting. Within a generation, the technique became invisible — the brain learned a new grammar.',
 v:[['Saccade','A rapid eye movement between fixation points.'],['Continuity editing','Editing techniques that make cuts feel seamless.']],
 q:[['When do editors most often place a cut?',['At random','During a movement or attention shift','Only at the end of scenes','When actors blink'],1,'Cutting on action or attention shifts hides the transition.']]}],

['lit_story_shape','Why Do Stories Have the Same Shape?','A stranger arrives; a hero leaves home; things get worse before they get better. Why do we never tire of it?','Literature','Narrative','comfortable',7,['stories','narrative','structure','psychology'],['hist_printing','film_cuts','psy_memreal'],{
 s:'Stories share shapes because they mirror how humans experience change: stability, disruption, struggle and a new stability. That arc is how we make sense of our own lives, so it feels satisfying in fiction.',
 w:'Narrative is a thinking tool. It packages cause and effect, choice and consequence, into something memorable. Shapes that match our sense of how life works — problems escalate, then resolve — are easier to follow and more emotionally rewarding.',
 h:'Researchers analysing thousands of novels by emotional tone found a handful of recurring arcs: rise, fall, rise-fall, fall-rise ("man in a hole"), and so on. Aristotle noted beginning, middle and end; the "hero\'s journey" describes departure, ordeal, return. Writers subvert these expectations deliberately — but subversion only works because the shape is expected.',
 e:'Tell a friend about your day and you will naturally structure it: what you planned, what went wrong, how it turned out. You are using story shape without thinking.',
 f:'In one study, people remembered facts embedded in a story up to 22 times better than the same facts presented as a list.',
 v:[['Narrative arc','The overall shape of a story\'s tension and resolution.'],['Hero\'s journey','A common story template of departure, trial and return.']],
 q:[['Why do common story shapes feel satisfying?',['Publishers demand them','They mirror how humans experience and remember change','They are shorter','They avoid emotions'],1,'Story shapes match our sense-making patterns.']]}],

['phil_free_will','Do You Really Have Free Will?','Brain activity predicting a choice can be measured before you feel you have decided. What does that mean?','Philosophy','Mind','challenge',12,['free will','determinism','choice','neuroscience'],['neuro_consciousness','phil_ship','law_contract'],{
 s:'Whether you have free will depends on what you mean by it. If it means acting without any cause, science suggests no. If it means acting according to your own reasons, without coercion, then arguably yes — and that is the kind that matters for responsibility.',
 w:'Every event seems to have prior causes, including brain events. Your decision is caused by your character, which was caused by genes and experience you did not choose. That worries people. But "uncaused" choice would be random, not free — a coin flip is not freedom either.',
 h:'Philosophers split into camps. Hard determinists say free will is an illusion. Libertarians say some choices are genuinely uncaused. Compatibilists — the majority — say freedom means your actions flow from your own deliberation, unforced by others, and that this is compatible with causation. Neuroscience experiments (Libet, and later fMRI studies) show preparatory brain activity before conscious awareness of a decision, but critics note the tasks were trivial and predictions weak. The law already uses a compatibilist test: could the person have responded to reasons?',
 e:'You choose tea over coffee. That choice came from your tastes, your mood and your history. You did not choose those — yet the choice was still yours, in the sense that no one made it for you.',
 f:'People told that free will is an illusion cheat more in experiments shortly afterwards — belief in free will affects behaviour, whatever its truth.',
 v:[['Determinism','The view that every event is fully caused by prior events.'],['Compatibilism','The view that free will and determinism can both be true.'],['Libet experiment','A study showing brain activity preceding conscious awareness of a decision.']],
 q:[['What do compatibilists claim?',['Nothing is caused','Freedom means acting from your own reasons without coercion, even if caused','Choices are random','Only gods have free will'],1,'Compatibilism redefines freedom as self-governed action.']], pre:['neuro_consciousness']}],

['phil_trolley','Why Is the Trolley Problem So Hard?','Pull a lever and one person dies instead of five. Most people would. Push a man to achieve the same result — most would not.','Philosophy','Ethics','comfortable',7,['ethics','trolley problem','morality','decisions'],['phil_free_will','ai_bias','phil_stoic'],{
 s:'The trolley problem is hard because two moral systems inside us disagree: one counts outcomes (five lives beat one), the other forbids certain actions regardless of results (do not use a person as a means).',
 w:'Humans evolved quick emotional responses to direct harm — pushing someone feels viscerally wrong — alongside slower reasoning that can calculate. When the two conflict, we feel torn, and neither answer feels fully right.',
 h:'Philosophers call the outcome-focused view consequentialism and the rule-focused view deontology. Brain imaging shows the "push" version activates emotional regions more strongly than the "lever" version. The dilemma is now practical: self-driving cars must be programmed with priorities. Surveys across cultures show broad agreement on saving more lives, but wide disagreement on details like age and lawfulness.',
 e:'Doctors face a version daily: a treatment that saves most patients but harms a few. Policies on triage are trolley problems written into guidelines.',
 f:'When asked whether a self-driving car should sacrifice its passenger to save pedestrians, most people say yes — and also say they would not buy such a car.',
 v:[['Consequentialism','Judging actions by their outcomes.'],['Deontology','Judging actions by rules and duties, regardless of outcome.']],
 q:[['Why do people react differently to the lever and the push versions?',['The maths differs','Direct physical harm triggers a stronger emotional response','The push saves fewer people','People misunderstand'],1,'Emotional and calculating systems conflict more strongly in the push case.']]}],

['phil_stoic','What Did the Stoics Actually Teach?','A Roman emperor and a Greek slave wrote nearly the same advice. It is not about suppressing feelings.','Philosophy','Ancient Philosophy','easy',7,['stoicism','philosophy','emotion','resilience'],['phil_trolley','psy_procrastinate','hist_rome_arch'],{
 s:'Stoicism teaches that peace comes from focusing on what you control — your judgements and actions — and accepting what you do not. Emotions arise from judgements, so examining the judgement changes the emotion.',
 w:'Most distress comes from wanting external things — reputation, outcomes, other people\'s behaviour — to be other than they are. The Stoics argued that these are not fully in your power, and treating them as if they were guarantees frustration.',
 h:'Epictetus, born a slave, opened his handbook with the "dichotomy of control". Marcus Aurelius, emperor, wrote private notes reminding himself that others\' actions cannot harm his character. Key practices: negative visualisation (imagining loss to appreciate what you have), the view from above (zooming out to see your problem\'s scale), and distinguishing first impressions from judgements. Modern cognitive behavioural therapy borrows directly from this.',
 e:'Stuck in traffic, a Stoic asks: can I change this? No. Then the traffic is not the problem — my demand that it be otherwise is.',
 f:'"Stoic" in everyday English means emotionless, but the ancient Stoics valued joy, affection and justice. Their target was destructive passions, not feeling itself.',
 v:[['Dichotomy of control','Separating what is up to you from what is not.'],['Negative visualisation','Deliberately imagining loss to increase gratitude and reduce fear.']],
 q:[['According to the Stoics, where does most distress come from?',['Bad luck','Demanding that things outside our control be different','Other people','Weather'],1,'The judgement, not the event, produces the distress.']]}],

['law_contract','What Makes a Promise Legally Binding?','You make dozens of promises a week. Only some could land you in court.','Law & Society','Law Basics','easy',6,['contracts','law','promises','agreements'],['phil_free_will','biz_brand_trust','econ_market'],{
 s:'A contract needs an offer, acceptance, something of value exchanged by both sides ("consideration"), and an intention to be legally bound. Miss one, and it is just a promise.',
 w:'Courts cannot enforce every promise — it would swamp them and intrude on private life. The rules filter for agreements that look like genuine bargains between people who meant business, and leave social promises to social pressure.',
 h:'Offer: a clear proposal. Acceptance: agreeing to those exact terms (change them, and it becomes a counter-offer). Consideration: each side gives or promises something — money, goods, work. Intention: commercial dealings are presumed binding; family arrangements are presumed not. Contracts can be oral, though writing helps prove them, and some — land sales — must be written. Terms that are unfair, illegal or agreed under pressure can be struck down.',
 e:'Clicking "I agree" on a website is acceptance of an offer, and access to the service is your consideration. Whether every buried term is enforceable is where courts step in.',
 f:'In a famous 1893 case, a company promised 100 to anyone who caught flu after using its "smoke ball". A customer did, sued, and won: an advertisement can be a binding offer to the whole world.',
 v:[['Consideration','Something of value each party gives in a contract.'],['Offer and acceptance','A clear proposal and unconditional agreement to it.']],
 q:[['Which is NOT required for a binding contract?',['Offer and acceptance','Consideration','A written document in every case','Intention to be legally bound'],2,'Many contracts are valid orally; writing helps prove them.']]}],

['env_climate_feedback','What Is a Climate Feedback Loop?','Melting ice causes more melting. Warming releases gases that cause more warming. Why the climate can change faster than the push.','Environment','Climate Science','comfortable',8,['climate','feedback','ice','carbon'],['geo_currents','chem_water','econ_tragedy_commons'],{
 s:'A feedback loop is when the result of a change feeds back to strengthen (or weaken) that change. In climate, several loops amplify warming, which is why small pushes can have large effects.',
 w:'Earth\'s climate is a connected system: ice, oceans, forests, permafrost and clouds all respond to temperature and also influence it. When a response pushes temperature further in the same direction, the system accelerates rather than settling.',
 h:'Ice-albedo: bright ice reflects sunlight; when it melts, dark ocean absorbs more heat, melting more ice. Water vapour: warmer air holds more moisture, and water vapour is itself a greenhouse gas. Permafrost: thawing ground releases stored methane and CO₂. Some loops dampen instead — more CO₂ speeds plant growth, which absorbs some carbon — but the amplifying ones currently dominate. Scientists watch for tipping points where a loop becomes self-sustaining.',
 e:'The Arctic has warmed nearly four times faster than the global average — the ice-albedo loop in action.',
 f:'Earth has flipped between ice ages and warm periods triggered by tiny orbital wobbles — the feedbacks did the heavy lifting each time.',
 v:[['Albedo','How much sunlight a surface reflects.'],['Tipping point','A threshold beyond which change becomes self-reinforcing and hard to reverse.']],
 q:[['Why does melting sea ice accelerate warming?',['Ice releases heat','Dark ocean absorbs more sunlight than bright ice','Ice is a greenhouse gas','It does not'],1,'Lower albedo means more energy absorbed.']]}],

['env_bees','Why Do Bees Matter So Much?','One in three mouthfuls of food depends on an animal moving pollen from flower to flower.','Environment','Ecosystems','easy',6,['bees','pollination','food','ecosystems'],['bio_trees_talk','econ_tragedy_commons','bio_ant'],{
 s:'Bees and other pollinators transfer pollen between flowers, allowing plants to produce fruit and seeds. About 75% of food crops benefit from animal pollination, and bees do much of it.',
 w:'Plants cannot move to find mates, so many pay insects in nectar to carry pollen for them. Bees are exceptionally good couriers: hairy bodies, flower loyalty on each trip, and colonies that send out thousands of workers.',
 h:'Bees visit flowers for nectar and pollen. Pollen sticks to their hairs and rubs off on the next flower\'s stigma, fertilising it. Honeybees communicate flower locations through the "waggle dance". Wild bees — over 20,000 species — often pollinate crops honeybees cannot. Threats include habitat loss, pesticides (especially neonicotinoids), parasites like the Varroa mite and climate change disrupting flowering times.',
 e:'Almond orchards in California import over a million hives each spring because local pollinators cannot handle the scale of blossom.',
 f:'In parts of China where wild bees have vanished, farmers hand-pollinate pear trees with brushes — a task that shows exactly what bees are worth.',
 v:[['Pollination','Transferring pollen to fertilise a plant.'],['Waggle dance','A honeybee movement that communicates the direction and distance of food.']],
 q:[['Roughly what share of food crops benefit from animal pollination?',['About 5%','About 25%','About 75%','100%'],2,'Around three-quarters of crop types benefit.']]}],

['soc_crowds','Why Do Crowds Behave Differently From Individuals?','Reasonable people, together, do things none would do alone. Sometimes wonderful, sometimes terrible.','Sociology','Group Behaviour','comfortable',7,['crowds','social identity','conformity','behaviour'],['bio_ant','soc_status','ai_swarm'],{
 s:'In a crowd, people shift from thinking of themselves as individuals to thinking as members of a group. Their behaviour then follows the group\'s norms — which can be more generous, braver, or more destructive than any individual\'s.',
 w:'Humans are deeply social; belonging changes what feels normal and what feels safe. Responsibility feels shared, cues come from others rather than personal judgement, and emotions spread quickly through faces and voices.',
 h:'Older theories blamed "mob madness" or anonymity. Modern social identity research shows crowds are not irrational: they act according to what the group\'s identity implies. Fans, protesters and emergency crowds mostly behave cooperatively — panic is rare. But when a group defines outsiders as enemies, the same mechanism enables violence. Policing that treats a crowd as one hostile mass tends to create the unity it fears.',
 e:'In evacuations, people often help strangers and queue rather than stampede — contradicting the film cliché. Disasters typically bring out cooperation, not chaos.',
 f:'Applause is contagious in measurable ways: how long a crowd claps depends more on how many others are clapping than on how good the performance was.',
 v:[['Social identity','The part of self-concept that comes from group membership.'],['Norm','An unwritten rule about how members of a group behave.']],
 q:[['What mainly guides behaviour in a crowd, according to modern research?',['Loss of all reasoning','The norms of the group identity people adopt','Weather','Random chance'],1,'Crowds act in line with shared identity, not madness.']]}],

['soc_status','Why Do Humans Care So Much About Status?','We compete for things that cannot be eaten or spent — respect, rank, being seen. The drive is ancient.','Sociology','Social Dynamics','comfortable',7,['status','hierarchy','psychology','society'],['psy_firstimp','biz_network','soc_crowds'],{
 s:'Status — how others rank and respect you — historically determined access to food, mates and protection. The brain treats gains and losses in status much like physical rewards and threats.',
 w:'In small ancestral groups, standing decided who ate first and whose children survived. A brain that tracked and pursued status left more descendants. That machinery now runs in offices, schools and social media, where "likes" are quantified rank.',
 h:'Researchers distinguish dominance (status through force or intimidation) from prestige (status freely granted for skill or generosity). Humans uniquely rely heavily on prestige. Brain imaging shows the reward system responding to status gains, and stress hormones rising with social rank threats. Status is relative, which is why income above local comparison levels raises happiness more than absolute wealth does.',
 e:'People say they would rather earn 50,000 where others earn 25,000 than 100,000 where others earn 200,000 — relative standing beats absolute income.',
 f:'In studies of British civil servants, those in lower-ranked jobs had significantly higher rates of heart disease even after accounting for lifestyle — rank itself affected health.',
 v:[['Prestige','Status granted voluntarily for valued skills or qualities.'],['Dominance','Status maintained through force or intimidation.']],
 q:[['How does the brain respond to a gain in social status?',['It ignores it','Its reward system activates, similar to physical rewards','It shuts down','It triggers sleep'],1,'Status gains engage the same reward circuits as tangible rewards.']]}],

['eng_arch','Why Are Arches So Strong?','A shape made of loose stones can carry a road for two thousand years. The secret is in how it pushes.','Engineering','Structures','easy',6,['arches','structures','forces','architecture'],['hist_rome_arch','eng_plane','chem_rust'],{
 s:'An arch turns the downward weight it carries into sideways pushes that travel along its curve into the ground. Stone is weak when pulled but immensely strong when squeezed — and an arch keeps every stone squeezed.',
 w:'A flat beam bends under load: its top is compressed but its bottom is stretched, and stone or brick cracks when stretched. The arch avoids stretching entirely by redirecting force along a curve, so every piece is pressed against its neighbour.',
 h:'Each wedge-shaped stone (voussoir) transfers load to the next, down to the supports (abutments), which must resist the outward thrust — hence thick walls or buttresses. The keystone at the top locks the curve. Domes are arches rotated; vaults are arches extended. Modern bridges and even eggshells use the same principle: shape that keeps material in compression.',
 e:'Roman aqueducts carried water across valleys on rows of arches, some still standing and carrying roads today.',
 f:'An arch built of loose bricks with no mortar can support many tonnes — as long as its curve stays within the right shape. Remove the supports before the keystone is in, and it collapses instantly.',
 v:[['Compression','A squeezing force.'],['Thrust','The sideways push an arch exerts on its supports.'],['Keystone','The central stone that locks an arch together.']],
 q:[['Why do arches suit stone so well?',['Stone is light','Arches keep every stone in compression, which stone handles well','Stone bends easily','Arches need no supports'],1,'Compression avoids the tension that cracks stone.']]}],

['eng_plane','How Does a Plane Stay Up?','Four hundred tonnes of metal, held up by air. The popular explanation is wrong.','Engineering','Aerodynamics','comfortable',8,['flight','aerodynamics','lift','physics'],['eng_arch','space_orbit','sport_muscle'],{
 s:'Wings generate lift by pushing air downward. Air flows faster over the curved top and slower beneath, creating lower pressure above than below — and the wing is pushed up.',
 w:'Newton\'s third law: if the wing pushes air down, air pushes the wing up. Bernoulli\'s principle: faster-moving air has lower pressure. Both descriptions are true and describe the same event from different angles. The popular "equal transit time" story — that air must meet at the trailing edge — is false.',
 h:'A wing is tilted slightly upward (angle of attack) and curved. Air follows the curved upper surface, accelerating and turning downward as it leaves. The pressure difference across the wing, multiplied by wing area, gives lift. Increase speed or angle and lift grows — until the angle is too steep, airflow separates, and the wing stalls. Engines provide thrust to overcome drag; lift balances weight.',
 e:'Hold your hand flat out of a car window and tilt it slightly. The air pushes it up — your hand is a wing.',
 f:'A paper plane and a jumbo jet fly by the same physics, and airliners can glide about 15 kilometres forward for every kilometre of altitude with all engines off.',
 v:[['Lift','The upward force generated by airflow over a wing.'],['Angle of attack','The angle between the wing and oncoming air.'],['Stall','Loss of lift when airflow separates from the wing at too steep an angle.']],
 q:[['What is wrong with the "equal transit time" explanation of lift?',['Nothing','Air over the top does not need to meet the air below at the same time — and in fact arrives earlier','Wings are flat','Air does not move'],1,'The upper flow is faster and reaches the trailing edge first.']]}],

['math_exponential','Why Is Exponential Growth So Hard to Imagine?','A lily pad doubles daily and covers a pond in 30 days. On which day was the pond half covered?','Mathematics','Growth','easy',6,['exponential','growth','intuition','mathematics'],['fin_compound','math_probability','env_climate_feedback'],{
 s:'Human intuition expects things to grow by adding. Exponential growth multiplies — so it looks slow for ages and then explodes. Day 29, by the way. The pond is half covered on day 29.',
 w:'Our brains evolved in a world of linear change: walking, gathering, building. Doubling processes — populations, epidemics, compound interest, viral spread — were rare or invisible. So we consistently underestimate them, especially early on.',
 h:'Linear growth adds a fixed amount per step; exponential growth multiplies by a fixed factor. Doubling 30 times turns 1 into over a billion. The Rule of 72 estimates doubling time. Because most of the growth happens in the last few doublings, warnings often come when it is already late — an infection at day 25 looks manageable; by day 30 it fills the pond.',
 e:'A rumour told to three people who each tell three more reaches over 59,000 people in ten rounds — and 3.4 billion in twenty.',
 f:'The legend of the chessboard: a king agrees to pay one grain of rice on the first square, doubling each square. By square 64 the total is about 18 quintillion grains — more rice than has ever been grown.',
 v:[['Exponential growth','Growth by a constant multiplying factor per step.'],['Doubling time','How long a quantity takes to double.']],
 q:[['If a pond is fully covered on day 30 by daily-doubling lily pads, when was it half covered?',['Day 15','Day 25','Day 29','Day 20'],2,'One doubling before full coverage means half coverage on day 29.']]}],

['math_prime','Why Do Primes Protect Your Passwords?','Numbers that cannot be divided guard nearly every secret on the internet.','Mathematics','Number Theory','deep',10,['primes','cryptography','mathematics','security'],['tech_encryption','math_probability'],{
 s:'Prime numbers are the building blocks of all whole numbers, and there is no fast known way to break a huge number into its primes. Modern encryption turns that difficulty into a lock.',
 w:'Security needs a problem that is easy in one direction and hard in the other. Multiplying two 300-digit primes takes a computer microseconds. Working backwards from the product to the primes would take longer than the universe has existed. That asymmetry is the whole game.',
 h:'A prime is a number greater than 1 divisible only by itself and 1. Every whole number has exactly one prime factorisation. RSA encryption picks two huge primes, multiplies them into a public key, and keeps the primes as the private key. Messages are scrambled with the public product and can only be unscrambled by someone who knows the factors. Primes are plentiful — there are infinitely many, as Euclid proved — and finding random large ones is easy with probabilistic tests.',
 e:'The padlock in your browser depends on a number so large that all the world\'s computers combined could not factor it before the Sun dies.',
 f:'Quantum computers could in theory factor large numbers quickly, which is why cryptographers are already switching to "post-quantum" methods based on different hard problems.',
 v:[['Prime number','A whole number greater than 1 divisible only by 1 and itself.'],['Factorisation','Breaking a number into the primes that multiply to make it.']],
 q:[['Why are large primes useful in encryption?',['They are rare','Multiplying them is easy but factoring the result is extremely hard','They are lucky','Computers cannot store them'],1,'The one-way difficulty of factoring is the basis of RSA.']], next:['tech_encryption']}],

['math_probability','Why Is the Birthday Paradox So Surprising?','In a room of 23 people, there is a 50% chance two share a birthday. Almost nobody believes it.','Mathematics','Probability','comfortable',7,['probability','intuition','statistics','coincidence'],['math_exponential','crit_correlation','fin_diversify'],{
 s:'You are not asking whether someone shares your birthday — you are asking whether any pair shares one. With 23 people there are 253 pairs, and 253 chances at a 1-in-365 event add up fast.',
 w:'Intuition focuses on one person (you) and 365 days. But the number of comparisons grows quadratically with group size. Our brains count people; probability counts pairs.',
 h:'It is easier to compute the chance that nobody shares. The second person avoids the first\'s birthday with probability 364/365, the third avoids both with 363/365, and so on. Multiply 23 such fractions and you get about 0.49 — so the chance of at least one match is about 51%. At 50 people it is 97%; at 70, 99.9%. The same maths explains why coincidences feel constantly surprising: with enough pairs, unlikely matches become likely.',
 e:'In any football match, with 22 players and a referee, there is a better-than-even chance that two people on the pitch share a birthday.',
 f:'This principle is used in cryptography: "birthday attacks" find two documents with the same digital fingerprint far faster than brute force would suggest.',
 v:[['Pairwise comparison','Comparing every possible pair in a group.'],['Complement','The probability of an event not happening, often easier to compute.']],
 q:[['Why does the birthday match become likely with only 23 people?',['Birthdays cluster','There are 253 pairs, each a chance for a match','23 is a magic number','Most people are born in one month'],1,'Comparisons grow as pairs, not as people.']]}],

['fut_fusion','Will We Ever Have Fusion Power?','The Sun\'s power source, in a building. Always thirty years away — until recently.','Future Technology','Energy','deep',10,['fusion','energy','plasma','future'],['space_stars_die','env_climate_feedback','fut_quantum_computer'],{
 s:'Fusion joins light atoms into heavier ones, releasing huge energy with no carbon and little long-lived waste. The challenge is holding a gas hotter than the Sun\'s core still enough, long enough, to get more energy out than in.',
 w:'Atomic nuclei are positively charged and repel each other fiercely. Only at extreme temperature and pressure do they collide hard enough to fuse. The Sun uses gravity to do this; on Earth we must use magnetic fields or lasers, and both leak energy.',
 h:'Two main paths. Tokamaks use doughnut-shaped magnetic fields to confine plasma at 150 million °C; ITER in France aims to produce ten times the heating power it consumes. Inertial confinement fires lasers at a fuel pellet; in December 2022 the US National Ignition Facility achieved "ignition" — more fusion energy out than laser energy in — for the first time. Private companies are racing with new superconducting magnets. The remaining problems are engineering: materials that survive neutron bombardment, breeding tritium fuel, and running continuously.',
 e:'The fuel — deuterium from seawater and lithium — is so abundant that a bathtub of water and a laptop battery\'s worth of lithium could power a household for decades.',
 f:'The joke that fusion is "always 30 years away" comes partly from funding: in the 1970s, US scientists laid out an aggressive plan that would have reached fusion by the 1990s — and Congress funded the "fusion never" scenario.',
 v:[['Plasma','A superheated gas in which electrons are stripped from atoms.'],['Tokamak','A doughnut-shaped magnetic device for confining fusion plasma.'],['Ignition','The point where fusion produces more energy than was put in to start it.']],
 q:[['What is the main challenge of fusion power on Earth?',['Finding fuel','Confining extremely hot plasma long enough to gain energy','It is illegal','Nobody understands the physics'],1,'Confinement and net energy gain are the core hurdles.']]}],

['fut_brain_computer','Can Brains Talk to Computers?','A paralysed patient moves a cursor by thinking. The signal is real; the interface is the hard part.','Future Technology','Neurotechnology','comfortable',8,['brain-computer interface','neurotechnology','future','neuroscience'],['neuro_plastic','bio_gene_editing','ai_pattern'],{
 s:'Brain-computer interfaces read electrical patterns from neurons and translate them, using machine learning, into commands — moving cursors, robotic arms or synthesised speech.',
 w:'Every intention to move produces a characteristic pattern of neural firing in the motor cortex. If sensors can record enough neurons and software can learn the pattern, the intention can be decoded without the body ever moving.',
 h:'Non-invasive EEG caps read blurry signals through the skull — enough for simple control. Implanted electrode arrays record individual neurons and allow fine control: patients have typed at over 60 words per minute by imagining handwriting, and speech decoders reach about 80 words per minute. Machine learning maps patterns to outputs, and neuroplasticity lets users improve with practice. Challenges: scar tissue degrading signals, surgery risk, and the ethics of reading — or writing — neural data.',
 e:'In 2023 a woman with ALS regained speech through an implant that decodes attempted speech into text and a synthesised voice modelled on recordings from before her illness.',
 f:'Users of brain implants describe the cursor as feeling like a part of their body within days — the brain absorbs tools into its body map, just as it does with a tennis racket.',
 v:[['Electrode array','A grid of tiny sensors that records electrical activity from neurons.'],['Neural decoding','Translating brain activity patterns into meaningful outputs.']],
 q:[['What allows a brain implant to control a cursor?',['Reading thoughts as words','Decoding motor cortex firing patterns with machine learning','Magic','Muscle movements'],1,'Intent-to-move patterns are decoded into commands.']], pre:['neuro_plastic']}],

['fut_quantum_computer','What Would a Quantum Computer Do?','It does not try every answer at once — despite what the headlines say. What it actually does is stranger.','Future Technology','Quantum Computing','challenge',11,['quantum computing','qubits','future','mathematics'],['phy_quantum','math_prime','tech_encryption'],{
 s:'Quantum computers use qubits that exist in superpositions and can be entangled. Clever algorithms make wrong answers cancel out and right answers reinforce — solving certain problems exponentially faster than classical machines.',
 w:'Some problems — factoring, simulating molecules, some optimisations — grow impossibly hard for ordinary computers as they scale. Quantum systems naturally embody the mathematics of those problems, so a controllable quantum system can compute them directly.',
 h:'A qubit can be 0, 1 or a weighted combination. N entangled qubits describe 2^N amplitudes simultaneously — but measuring collapses them to one answer. The trick is interference: algorithms like Shor\'s (factoring) and Grover\'s (search) arrange the computation so that paths to wrong answers cancel. Qubits are fragile; the smallest disturbance destroys the state, so machines run near absolute zero and need error correction that uses many physical qubits per reliable logical one.',
 e:'A quantum computer could simulate a new battery material or drug molecule exactly, where classical computers must approximate — potentially shortcutting years of lab work.',
 f:'Current quantum machines have hundreds to a few thousand noisy qubits. Breaking today\'s encryption would need millions of error-corrected ones — but cryptographers are not waiting.',
 v:[['Qubit','A quantum bit that can be in a superposition of 0 and 1.'],['Entanglement','A link between qubits so that their states cannot be described independently.'],['Interference','Wave-like addition and cancellation used to amplify correct answers.']],
 q:[['How do quantum algorithms find answers?',['By trying all answers and printing them','By arranging interference so wrong answers cancel and right ones reinforce','By guessing','By using more electricity'],1,'Interference, not brute-force parallelism, is the mechanism.']], pre:['phy_quantum']}],

['cul_handshake','Why Do We Shake Hands?','A gesture so automatic you never wonder about it. Its origins involve weapons.','Culture','Customs','easy',4,['customs','greetings','culture','history'],['soc_status','psy_firstimp'],{
 s:'Handshakes likely began as a way to show an open, weaponless right hand and to seal agreements. The gesture survived because it signals trust, equality and commitment in a single movement.',
 w:'Greetings solve a problem: how to approach a stranger safely. Showing an empty hand and allowing touch is a costly, credible signal of peaceful intent — hard to fake if you were holding a dagger.',
 h:'Carvings from the 9th century BCE show Assyrian and Babylonian kings clasping hands to seal alliances. Greek and Roman art used it for oaths and farewells. The up-and-down shake may have been meant to dislodge hidden weapons from sleeves. Quakers popularised the handshake as an egalitarian alternative to bowing in the 17th century. Cultures vary: bows, cheek kisses and nose presses solve the same problem differently.',
 e:'Business deals are still "sealed with a handshake" — an echo of the oath-taking function thousands of years old.',
 f:'Studies find that people unconsciously sniff their hand after a handshake, suggesting the gesture may also carry a chemical signalling role like animal greetings.',
 v:[['Costly signal','A behaviour that is credible because it would be hard or dangerous to fake.'],['Egalitarian','Treating people as equals.']],
 q:[['What did an early handshake most likely signal?',['Wealth','An empty, weaponless hand and peaceful intent','Hunger','Ownership'],1,'Open-hand contact credibly signalled no hidden weapon.']]}],

['food_fermentation','Why Does Fermentation Make Food Taste Better?','Bread, cheese, coffee, chocolate, soy sauce, wine. Microbes made them all delicious.','Food Science','Microbiology','comfortable',7,['fermentation','microbes','flavour','food'],['chem_maillard','food_bread','bio_immune'],{
 s:'Fermentation lets microbes break down sugars, proteins and fats into smaller, more flavourful molecules — acids, alcohols, and savoury amino acids like glutamate — while preserving the food.',
 w:'Raw ingredients lock flavour inside large molecules our tongues cannot detect. Bacteria and yeasts are tiny chemical factories that cut those molecules into pieces small enough to taste. Humans learned to harness them long before knowing they existed.',
 h:'Yeast converts sugar to alcohol and CO₂ (bread rises, beer brews). Lactic acid bacteria sour milk into yoghurt and cabbage into sauerkraut, and their acid keeps harmful microbes out. Moulds like Aspergillus break soybean protein into glutamate, giving soy sauce and miso deep umami. Cacao and coffee beans are fermented before roasting to develop their aroma precursors. Controlled fermentation is essentially slow, biological cooking.',
 e:'Cheddar aged for two years develops crunchy crystals and intense flavour because bacteria have spent that time dismantling proteins into savoury fragments.',
 f:'Chocolate does not taste like chocolate until the beans have fermented for several days in the heat — unfermented cacao is bitter and flat.',
 v:[['Fermentation','The breakdown of food molecules by microbes, producing acids, gases or alcohol.'],['Umami','The savoury taste, triggered by glutamate.']],
 q:[['Why does fermentation increase flavour?',['It adds sugar','Microbes break large molecules into smaller ones we can taste','It heats the food','It removes water'],1,'Small molecules like glutamate and acids are detectable by taste receptors.']]}],

['food_spicy','Why Does Spicy Food Feel Hot?','Chillies are not hot. They trick a temperature sensor.','Food Science','Sensory Science','easy',5,['spice','capsaicin','senses','pain'],['phy_heat','neuro_amygdala','chem_maillard'],{
 s:'Capsaicin in chillies binds to the same nerve receptor that detects dangerous heat. Your brain receives a "burning" signal even though nothing is actually hot.',
 w:'The receptor, TRPV1, evolved to warn of temperatures above about 43°C. Capsaicin happens to fit it, so the nerve fires as if scalded. The plant benefits: mammals avoid the fruit while birds, which lack sensitive TRPV1, eat it and spread seeds far.',
 h:'Once triggered, TRPV1 sends pain and heat signals; the body responds with sweating, flushing and endorphins. Repeated exposure desensitises the receptor, which is why regular chilli eaters tolerate more. Capsaicin is oil-soluble, so water spreads it while milk fat and casein protein wash it away. Mint\'s menthol does the opposite trick, fooling the cold receptor TRPM8.',
 e:'Sweating after a curry is your body responding to a heat alarm that was never real.',
 f:'Capsaicin is used in pain-relief creams: over-stimulating the receptor eventually numbs it, reducing chronic pain signals.',
 v:[['Capsaicin','The compound in chillies that triggers heat receptors.'],['TRPV1','A nerve receptor that detects heat and is activated by capsaicin.']],
 q:[['Why does milk soothe a chilli burn better than water?',['Milk is colder','Capsaicin dissolves in fat and binds to milk proteins','Water is spicy','Milk numbs the tongue'],1,'Oil-soluble capsaicin is carried away by fat and casein.']]}],

['sport_muscle','How Do Muscles Grow?','Lifting weights damages muscle. Growth is what happens next.','Sports Science','Physiology','easy',6,['muscle','exercise','training','recovery'],['bio_cells_renew','neuro_plastic','eng_plane'],{
 s:'Muscles grow when training creates tension and micro-damage, which triggers repair that rebuilds fibres slightly thicker than before. Growth happens during rest, fuelled by protein.',
 w:'The body adapts to demands. If muscles are stressed near their limit, it is cheaper for the body to strengthen them than to risk failure again. Without continued challenge, the extra tissue is expensive to maintain and shrinks away.',
 h:'Resistance triggers mechanical tension sensed by muscle cells, which activate signalling pathways (mTOR) that increase protein synthesis. Satellite cells donate nuclei to fibres, expanding their capacity. Early strength gains come mostly from the nervous system learning to recruit fibres better; visible growth follows over weeks. Progressive overload, adequate protein (about 1.6 g per kg of body weight per day) and sleep are the three levers.',
 e:'Beginners get noticeably stronger in two weeks without looking different — that is the nervous system, not new muscle.',
 f:'Muscle "memory" is real: nuclei gained during training persist for years after you stop, making regaining lost muscle far faster than building it the first time.',
 v:[['Hypertrophy','Growth in muscle fibre size.'],['Progressive overload','Gradually increasing training demand to keep prompting adaptation.']],
 q:[['When does muscle growth mainly occur?',['During the workout','During rest and recovery after training','While eating','During warm-up'],1,'Repair and protein synthesis happen between sessions.']]}],

['lang_babies','How Do Babies Learn Language So Fast?','No grammar lessons, no dictionary. By three, a child uses rules linguists struggle to describe.','Language','Acquisition','easy',7,['language','babies','learning','brain'],['ai_llm','neuro_plastic','mus_minor'],{
 s:'Babies are statistical learners with a brain primed for speech. They track which sounds go together, which words predict which, and test hypotheses constantly — in a critical window when the brain is exceptionally plastic.',
 w:'Language is too complex to learn by rote, and parents rarely correct grammar. Instead infants extract patterns: in a stream of syllables, some transitions are common (within words) and some rare (between words). Eight-month-olds detect those statistics after minutes of listening.',
 h:'Newborns already prefer their mother\'s language\'s rhythm. By six months they specialise in native sounds and lose the ability to distinguish foreign ones. Around twelve months come first words, around two years a vocabulary explosion of several words a day, and by three, complex grammar — including regular errors like "goed" that show rule-learning rather than copying. Social interaction is essential; babies do not learn from screens the way they learn from a person.',
 e:'A toddler who says "I runned" has never heard that word. They inferred a rule and applied it — evidence of learning structure, not mimicry.',
 f:'Babies exposed to two languages do not get confused; they learn both and show early advantages in switching attention between tasks.',
 v:[['Statistical learning','Picking up patterns from how often things occur together.'],['Critical period','A window in development when learning something is especially easy.']],
 q:[['What does a child saying "goed" instead of "went" show?',['A hearing problem','They have inferred a grammatical rule','They are copying adults','Language delay'],1,'Overregularisation reveals rule learning.']]}],

['crit_survivorship','Why Do We Learn the Wrong Lessons From Success?','During WWII, engineers wanted to armour the parts of planes with the most bullet holes. A statistician said: armour the parts with none.','Critical Thinking','Reasoning','easy',6,['survivorship bias','statistics','reasoning','evidence'],['psy_confirmation','crit_correlation','fin_diversify'],{
 s:'Survivorship bias is drawing conclusions from the examples that made it through a filter while ignoring the ones that did not. The survivors are visible; the failures are silent.',
 w:'We only see what remains: the successful entrepreneurs, the returning planes, the buildings still standing. The missing data — dropouts who failed, planes that crashed, buildings that fell — is exactly what would tell us about risk, but it never reaches our eyes.',
 h:'Abraham Wald realised returning planes showed where a plane could be hit and survive; the missing planes had been hit elsewhere. So armour the untouched areas. The same error appears in "college dropouts become billionaires" (most do not), "old buildings were built better" (the bad ones collapsed), and mutual fund performance (failed funds are removed from records). The antidote is to ask: what am I not seeing, and why?',
 e:'Advice from successful people is filtered by success. A hundred others followed the same advice and failed — but nobody interviews them.',
 f:'Cats falling from higher floors appeared to survive more often in vet records than cats falling from lower floors — until someone noted that cats who die from high falls are never brought to the vet.',
 v:[['Survivorship bias','Focusing on successes that passed a selection process while overlooking failures.'],['Selection effect','Distortion caused by how examples were chosen or filtered.']],
 q:[['Why did Wald recommend armouring areas with no bullet holes?',['Those areas were prettier','Planes hit there did not return, so damage there was fatal','Bullets never hit there','Armour was cheaper there'],1,'The missing data — downed planes — held the real lesson.']]}],

/* ================= 6. LEARNING LOGIC ================= */

function loopStats(S, loop) {

  const days = S.journey.filter(j => j.loop === loop && j.status === 'completed').length;

  const vocab = sum(topics.map(id => (getTopic(id) || { vocabulary: [] }).vocabulary.length));
  const q = lessons.filter(l => l.quiz && l.quiz.total);
  const acc = q.length ? sum(q.map(l => l.quiz.correct)) / sum(q.map(l => l.quiz.total)) : 0;
  return { days, hours: Math.max(1, Math.round(minutes / 60)), topics: topics.length, cats: cats.length, catList: cats, vocab, acc: Math.round(acc * 100), reflections: S.journalEntries.filter(j => j.loop === loop).length, lessons: lessons.length, surprises: lessons.filter(l => l.surprise).length };
}

/* ---------- Knowledge map ---------- */
let kSelected = null;
function buildKnowledgeSVG(interactive = true) {
  const cats = Object.entries(S.knowledgeState).filter(([k]) => k !== '__topics').sort((a, b) => b[1].count - a[1].count);
  if (!cats.length) return '';
  const W = 860, H = 640, cx = W / 2, cy = H / 2, n = cats.length, R1 = n > 10 ? 200 : 175, R2 = R1 + 105;
  const done = new Set(S.user.completedTopics); const nodes = [], links = [];
  const catPos = {};
  cats.forEach(([c, v], i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n; const x = cx + R1 * Math.cos(a), y = cy + R1 * Math.sin(a);
    catPos[c] = { x, y, a }; const r = 14 + Math.min(v.count, 24) * 1.1;
    links.push({ x1: cx, y1: cy, x2: x, y2: y, cls: '' });
    nodes.push({ kind: 'cat', key: c, x, y, r, label: c, sub: `${v.count}`, strength: v.strength, delay: i * 40 });
    const subs = Object.entries(v.subs || {}); const spread = Math.min(1.1, 2 * Math.PI / n * 0.85);
    subs.forEach(([s, cnt], j) => { const sa = a + (subs.length === 1 ? 0 : -spread / 2 + j * spread / (subs.length - 1)); const sx = cx + R2 * Math.cos(sa), sy = cy + R2 * Math.sin(sa); links.push({ x1: x, y1: y, x2: sx, y2: sy, cls: '' }); nodes.push({ kind: 'sub', key: s, cat: c, x: sx, y: sy, r: 6 + Math.min(cnt, 8) * 1.6, label: s, strength: v.strength, delay: 300 + j * 30 }); });
  });
  const seen = new Set();
  S.user.completedTopics.forEach(id => { const t = getTopic(id); if (!t) return; t.relatedTopics.forEach(rid => { const r = getTopic(rid); if (!r || !done.has(rid) || r.category === t.category) return; const k = [t.category, r.category].sort().join('|'); if (seen.has(k) || !catPos[t.category] || !catPos[r.category]) return; seen.add(k); links.push({ x1: catPos[t.category].x, y1: catPos[t.category].y, x2: catPos[r.category].x, y2: catPos[r.category].y, cls: 'cross' }); }); });
  const selCat = kSelected ? (kSelected.kind === 'cat' ? kSelected.key : kSelected.cat) : null;
  const nodeHTML = nodes.map(nd => { const dim = selCat && nd.kind === 'cat' ? nd.key !== selCat : selCat && nd.kind === 'sub' ? nd.cat !== selCat : false; const sel = kSelected && kSelected.kind === nd.kind && kSelected.key === nd.key; const fill = nd.kind === 'cat' ? 'var(--accent2)' : 'var(--accent)'; const op = 0.35 + nd.strength * 0.65; return `<g class="knode ${dim ? 'dim' : ''} knode-in" style="animation-delay:${nd.delay}ms" ${interactive ? `data-action="knode" data-kind="${nd.kind}" data-key="${esc(nd.key)}" data-cat="${esc(nd.cat || nd.key)}" role="button" tabindex="0" aria-label="${esc(nd.label)}"` : ''}><circle cx="${nd.x}" cy="${nd.y}" r="${nd.r}" fill="${fill}" fill-opacity="${op}" stroke="${sel ? 'var(--text)' : fill}" stroke-width="${sel ? 3 : 1.5}"/>${nd.kind === 'cat' ? `<text x="${nd.x}" y="${nd.y + 4}" text-anchor="middle" font-size="12">${esc(catIcon(nd.key))}</text><text x="${nd.x}" y="${nd.y + nd.r + 14}" text-anchor="middle" font-size="11">${esc(nd.label.length > 16 ? nd.label.slice(0, 15) + '…' : nd.label)}</text>` : `<text x="${nd.x}" y="${nd.y + nd.r + 11}" text-anchor="middle" font-size="9.5" fill-opacity=".8">${esc(nd.label.length > 18 ? nd.label.slice(0, 17) + '…' : nd.label)}</text>`}</g>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Your knowledge map with ${n} categories">${links.map(l => `<line class="klink ${l.cls}" x1="${l.x1}" y1="${l.y1}" x2="${l.x2}" y2="${l.y2}"/>`).join('')}
    <g><circle cx="${cx}" cy="${cy}" r="26" fill="var(--card)" stroke="var(--line2)" stroke-width="2"/><text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)">${esc(userInitial())}</text></g>${nodeHTML}</svg>`;
}
function renderKnowledge() {

  if (!cats.length) return `<p class="eyebrow">Knowledge galaxy</p><h1 class="h-page">Your map of ideas</h1><div class="mt-3">${emptyState('Your knowledge galaxy is just beginning.', 'Learn a few ideas and watch it grow.', '<a class="btn primary" href="#home">Today\'s Loop</a>')}</div>`;

      <div class="setting-row"><div><div class="s-title">Learning time</div><div class="s-sub">Preferred lesson length</div></div>${seg('preferredReadingTime', [[5, '5 min'], [10, '10'], [20, '20'], [30, '30+']], p.preferredReadingTime)}</div>
