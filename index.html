    <div class="card mt-3"><p class="eyebrow">Your data</p><p class="small muted mt-1">Everything is stored in this browser only. It is not encrypted and not backed up — export it if it matters to you.</p><div class="row mt-2"><button class="btn soft sm" data-action="export">Export JSON</button><button class="btn ghost sm" data-action="reset-user">Reset this learner</button></div></div>`;
}
function profileChanged() {
  const e = currentEntry(S);
  if (e && e.status === 'current') { const rec = generateDailyRecommendation(S); if (rec.topic.id !== e.topicId) { e.topicId = rec.topic.id; e.surprise = rec.surprise; e.reason = rec.reason; e.bridgeFrom = rec.bridgeFrom; toast("Today's Loop updated to match your profile", '↻'); } }
  saveState();
}

/* ---------- Settings ---------- */
function renderSettings() {
  const r = S.settings.reminders; const tog = (k, on, label, sub, action = 'toggle-reminder') => `<div class="setting-row"><div><div class="s-title">${label}</div><div class="s-sub">${sub}</div></div><button class="toggle" role="switch" aria-checked="${on}" aria-label="${label}" data-action="${action}" data-k="${k}"></button></div>`;
  return `<p class="eyebrow">Settings</p><h1 class="h-page">Make it yours</h1>
    <div class="card mt-3"><div class="setting-row"><div><div class="s-title">Theme</div><div class="s-sub">Light, dark, or follow your device</div></div><div class="seg">${['light', 'dark', 'system'].map(t => `<button class="${G.theme === t ? 'on' : ''}" data-action="set-theme" data-t="${t}" aria-pressed="${G.theme === t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div></div>
      ${tog('reduceMotion', G.reduceMotion, 'Reduce motion', 'Minimise animations (also follows your system setting)', 'toggle-motion')}</div>
    <div class="card mt-3"><p class="eyebrow">Reminders <span class="badge" style="margin-left:6px">Coming soon</span></p><p class="small muted mt-1">Preferences are saved now; notifications arrive in a future version.</p>
      ${tog('daily', r.daily, 'Daily reminder', 'A gentle nudge for today\'s Loop')}${tog('streak', r.streak, 'Streak reminder', 'Only when a streak is about to end')}${tog('remember', r.remember, 'Remember This', 'Occasional memory checks')}${tog('weekly', r.weekly, 'Weekly curiosity recap', 'What you learned this week')}${tog('monthly', r.monthly, 'Monthly reflection', 'A prompt to look back')}</div>
    <div class="card mt-3"><p class="eyebrow">Privacy & data</p><p class="small muted mt-1">Keep Loop runs entirely in your browser. Nothing is sent anywhere. Local storage is convenient but not secure — avoid writing sensitive information in your journal. You can export or erase everything at any time.</p><div class="row mt-2"><button class="btn soft sm" data-action="export">Export my data</button><button class="btn ghost sm" data-action="reset-all">Erase all Keep Loop data</button></div></div>
    <p class="center small muted mt-4">KEEP LOOP · Learn something interesting. Every day. · 365 days = One Loop → New Loop → Keep Loop continues 🔄</p>`;
}

/* ---------- Year in Knowledge / Loop completion ---------- */
let yrStage = 'review';
function renderYearReview() {
  if (yrStage === 'next' && S.loops.length) {
    const last = S.loops[S.loops.length - 1]; const now = S.user.interests; const added = now.filter(c => !last.interests.includes(c)); const evo = last.stats.catList.filter(c => !last.interests.includes(c)).slice(0, 6);
    return `<div class="yr-hero"><span class="loop-badge">YOUR NEXT LOOP</span><h1 class="h-display">Your interests have evolved.</h1></div>
      <div class="evolve card pad-lg"><div><p class="eyebrow">You started with</p><div class="chips mt-2">${last.interests.map(c => `<span class="chip sm">${catIcon(c)} ${esc(c)}</span>`).join('')}</div></div><div class="arrow">→</div><div><p class="eyebrow">Now your curiosity has expanded into</p><div class="chips mt-2">${uniq([...added, ...evo]).slice(0, 8).map(c => `<span class="chip sm on">${catIcon(c)} ${esc(c)}</span>`).join('') || '<span class="muted small">Still exploring…</span>'}</div></div></div>
      <div class="yr-hero"><span class="loop-badge">LOOP ${pad2(S.currentLoop)}</span><h2 class="h-display">A new 365-day journey<br>built from everything you've learned.</h2><p class="lead mt-3">Deeper topics. New connections. The same curiosity.</p><div class="mt-4"><button class="btn primary lg" data-action="start-next-loop">Start My Next Loop ${ICONS.arrow}</button></div></div>`;
  }
  const pending = S.loopCompletePending; const loop = pending ? S.currentLoop : (S.loops.length ? S.loops[S.loops.length - 1].loop : null);
  if (!loop) return `<div class="yr-hero"><h1 class="h-display">Your Loop isn't complete yet.</h1><p class="lead mt-3">Day ${S.currentDay} of 365. Keep going — this page will be waiting.</p>${createProgressBar(S.currentDay / 365 * 100, 'mt-3')}<div class="mt-4"><a class="btn primary" href="#home">Back to Today's Loop</a></div></div>`;
  const st = pending ? loopStats(S, loop) : S.loops[S.loops.length - 1].stats; const evo = curiosityEvolution(S);
  return `<div class="yr-hero"><span class="loop-badge">🎉 LOOP ${pad2(loop)} COMPLETE</span><div class="big">365</div><h1 class="h-display mt-2">days. discoveries.<br>One year of curiosity.</h1><p class="lead mt-3">You didn't finish learning. You finished one Loop.</p></div>
    <p class="eyebrow center">Your Loop in Knowledge</p>
    <div class="grid grid-3 stats mt-2">${statBox(st.days, 'Days completed')}${statBox(st.hours, 'Hours learning')}${statBox(st.topics, 'Topics explored')}${statBox(st.cats, 'Categories')}${statBox(st.vocab, 'New vocabulary words')}${statBox(st.acc + '%', 'Average quiz accuracy')}</div>
    <p class="eyebrow center mt-5">Your Knowledge Galaxy</p><div class="kmap-wrap mt-2">${buildKnowledgeSVG(false)}</div>
    <div class="card pad-lg mt-4 center"><p class="serif" style="font-size:22px">Your curiosity changed.</p><p class="muted mt-2">You began with</p><div class="chips mt-1" style="justify-content:center">${evo.start.map(c => `<span class="chip sm">${catIcon(c)} ${esc(c)}</span>`).join('')}</div><p class="muted mt-3">Over this Loop, your curiosity expanded into</p><div class="chips mt-1" style="justify-content:center">${evo.expanded.length ? evo.expanded.map(c => `<span class="chip sm on">${catIcon(c)} ${esc(c)}</span>`).join('') : '<span class="muted small">…everything you already loved, more deeply.</span>'}</div><p class="small muted mt-3">${st.reflections} reflections · ${st.surprises} surprises taken</p></div>
    <div class="yr-hero"><p class="closing">The Loop doesn't end here.<br>A new Loop begins.</p><p class="lead mt-3">365 more discoveries.<br>A deeper journey.<br>A different you.</p>
    ${pending ? `<div class="mt-4"><button class="btn primary lg" data-action="begin-loop">Begin Loop ${pad2(loop + 1)} ${ICONS.loop}</button></div>` : `<div class="mt-4"><a class="btn primary" href="#home">Back to Loop ${pad2(S.currentLoop)}</a></div>`}
    <p class="small muted mt-5">365 days = One Loop completed → New Loop begins → Keep Loop continues. 🔄</p><p class="serif mt-2" style="font-size:20px;letter-spacing:.08em;font-weight:700">KEEP THE CURIOSITY GOING.</p></div>`;
}

/* ================= 10. ROUTING, ACTIONS, THEME, INIT ================= */
function parseHash() { const raw = location.hash.replace(/^#\/?/, ''); const [path, param] = raw.split('/'); return { route: path || 'home', param: param ? decodeURIComponent(param) : null }; }
function navigate(h) { if (location.hash === h) renderApp(); else location.hash = h; }
function currentThemeIsDark() { return G.theme === 'dark' || (G.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches); }
function applyTheme() { document.documentElement.setAttribute('data-theme', currentThemeIsDark() ? 'dark' : 'light'); document.documentElement.setAttribute('data-motion', G.reduceMotion ? 'reduce' : 'auto'); }
function showFinding(fn, text = 'Finding something interesting for you…') {
  showModal(`<div class="center"><div style="display:inline-block;animation:spin 1.6s linear infinite;color:var(--accent2)">${LOGO_SVG.replace('class="logo-svg"', 'class="logo-svg" style="width:44px;height:44px"')}</div><p class="serif mt-2" style="font-size:20px">${text}</p><div class="skeleton mt-3" style="height:14px;width:70%;margin:auto"></div><div class="skeleton mt-1" style="height:14px;width:50%;margin:8px auto 0"></div></div>`, { persistent: true });
  setTimeout(() => { closeModal(); try { fn(); } catch (err) { console.error(err); toast('Something went sideways — your journey is safe.'); renderApp(); } }, G.reduceMotion ? 40 : 650);
}
function renderApp() {
  if (!S || !S.onboardingComplete) { renderOnboarding(); return; }
  const { route, param } = parseHash();
  if (route === 'onboarding') { ob = { step: 0, interests: [], time: 10, difficulty: 'easy', surprise: 'balanced', name: '' }; renderOnboarding(); return; }
  showApp();
  const views = { home: renderHome, journey: renderJourney, explore: renderExplore, search: renderSearch, library: renderLibrary, journal: renderJournal, progress: renderProgress, knowledge: renderKnowledge, achievements: renderAchievements, profile: renderProfile, settings: renderSettings, 'year-review': renderYearReview, complete: renderCompletion, lesson: () => renderLesson(param) };
  const fn = views[route] || renderHome;
  renderSidebar(route); renderHeader(route);
  let html;
  try { html = fn(); } catch (err) { console.error(err); html = `<div class="complete-wrap"><div class="card pad-lg"><div class="h-section">We couldn't load this page.</div><p class="muted mt-1">Your journey is safe.</p><button class="btn primary mt-3" data-action="retry-render">Try Again</button></div></div>`; }
  if (!html) return; // view redirected
  $('#view').innerHTML = html;
  try { window.scrollTo({ top: 0, behavior: 'instant' }); } catch (e) { window.scrollTo(0, 0); }
  bindViewInputs();
  if (route === 'lesson') requestAnimationFrame(updateLessonProgress);
  document.title = `${PAGE_TITLES[route] || 'Keep Loop'} · Keep Loop`;
}
function bindViewInputs() {
  const si = $('#search-input'); if (si) { si.addEventListener('input', () => { searchQuery = si.value; $('#search-results').innerHTML = renderSearchResults(); }); if (!searchQuery) si.focus(); }
  const li = $('#lib-search'); if (li) li.addEventListener('input', () => { libQuery = li.value; const tmp = document.createElement('div'); tmp.innerHTML = renderLibrary(); $('#lib-list').innerHTML = tmp.querySelector('#lib-list').innerHTML; });
}
const freshOb = () => ({ step: 0, interests: [], time: 10, difficulty: 'easy', surprise: 'balanced', name: '' });
function rerenderKeepScroll() { const y = window.scrollY; renderApp(); try { window.scrollTo({ top: y, behavior: 'instant' }); } catch (e) { window.scrollTo(0, y); } }

const ACTIONS = {
  'open-lesson': el => navigate('#lesson/' + el.dataset.id),
  'toggle-save': el => { const on = toggleSaved(el.dataset.id); toast(on ? 'Saved to your library' : 'Removed from saved', on ? '🔖' : ''); rerenderKeepScroll(); },
  'toggle-fav': el => { const on = toggleFavorite(el.dataset.id); toast(on ? 'Added to favourites' : 'Removed from favourites', on ? '❤️' : ''); rerenderKeepScroll(); },
  'quiz-answer': el => { if (!lessonSession) return; const q = +el.dataset.q, o = +el.dataset.o; if (lessonSession.answers[q] !== undefined) return; lessonSession.answers[q] = o; $('#quiz-block').innerHTML = renderQuizBlock(getTopic(lessonSession.topicId)); },
  'complete-lesson': el => completeLesson(el.dataset.id, el.dataset.reflect === '1'),
  'feedback': el => { applyFeedback(S, el.dataset.id, el.dataset.rating); saveState(); toast('Thanks — this shapes what comes next', '✓'); rerenderKeepScroll(); },
  'more-less': el => { applyMoreLess(S, el.dataset.id, el.dataset.more === '1'); saveState(); toast(el.dataset.more === '1' ? 'More like this, coming up' : "We'll show less of this"); rerenderKeepScroll(); },
  'one-more': () => {
    const e = currentEntry(S); const exclude = [...(e ? [e.topicId, ...e.extras] : []), ...S.user.completedTopics];
    const rec = generateDailyRecommendation(S, { salt: 'extra|' + (e ? e.extras.length : 0) + '|' + S.completedLessons.length, exclude });
    if (e && !e.extras.includes(rec.topic.id)) e.extras.push(rec.topic.id); saveState();
    showFinding(() => navigate('#lesson/' + rec.topic.id));
  },
  'surprise-me': () => {
    const e = currentEntry(S); const rec = generateSurpriseTopic(S, [...(e ? [e.topicId] : []), ...S.user.completedTopics]); const t = rec.topic;
    showModal(`<p class="eyebrow accent">✨ Surprise</p>${rec.bridgeFrom ? `<p class="muted mt-1">You love ${esc(rec.bridgeFrom)}. Today we're leaving it behind for a moment.</p>` : ''}<h3 class="mt-2">${esc(t.title)}</h3><p class="muted">${esc(t.hook)}</p><div class="row mt-2">${topicMeta(t)}</div>
      <div class="row mt-3"><button class="btn primary" data-action="surprise-swap" data-id="${t.id}">Make it today's Loop</button><button class="btn soft" data-action="surprise-extra" data-id="${t.id}">Just read it</button><button class="btn ghost" data-action="close-modal">Keep today's</button></div>`);
  },
  'surprise-swap': el => {
    const e = currentEntry(S);
    if (e && e.status === 'current') { if (!S.user.skippedTopics.includes(e.topicId)) S.user.skippedTopics.push(e.topicId); e.topicId = el.dataset.id; e.surprise = true; e.reason = 'You asked to be surprised.'; e.bridgeFrom = [...effectiveInterests(S)].find(i => (CROSS[i] || []).includes(getTopic(e.topicId).category)) || null; S.user.surpriseCount = (S.user.surpriseCount || 0); saveState(); }
    closeModal(); navigate('#lesson/' + el.dataset.id);
  },
  'surprise-extra': el => { const e = currentEntry(S); if (e && !e.extras.includes(el.dataset.id)) e.extras.push(el.dataset.id); saveState(); closeModal(); navigate('#lesson/' + el.dataset.id); },
  'close-modal': () => closeModal(),
  'remember-reveal': () => { $('#rem-answer').classList.remove('hidden'); $('#rem-actions').innerHTML = `<button class="btn sm soft" data-action="remember-result" data-ok="1">I remembered</button><button class="btn sm ghost" data-action="remember-result" data-ok="0">Fuzzy</button>`; },
  'remember-result': el => {
    S.memoryChecks = (S.memoryChecks || 0) + 1; const rem = pickRememberThis(S); const ok = el.dataset.ok === '1';
    if (rem) { const m = (S.knowledgeState.__topics || {})[rem.topic.id]; if (m) m.strength = clamp(m.strength + (ok ? 0.1 : -0.15), 0, 1); if (!ok) bump(S.user.topicAffinity, rem.topic.id, 0.3); }
    checkAchievements(S); saveState(); toast(ok ? 'Still there. Nice.' : 'Worth a quick revisit sometime.', ok ? '🧠' : '↻');
    $('#rem-actions').innerHTML = ok ? '<span class="badge ok">✓ Remembered</span>' : `<button class="btn sm soft" data-action="open-lesson" data-id="${rem ? rem.topic.id : ''}">Revisit now</button>`;
  },
  'retry-today': () => { startDay(S); saveState(); renderApp(); },
  'retry-render': () => renderApp(),
  'journey-loop': el => { journeyLoopView = +el.dataset.loop; renderApp(); },
  'explore-tab': el => { exploreTab = el.dataset.tab; renderApp(); },
  'explore-cat': el => { exploreCat = exploreCat === el.dataset.c ? null : el.dataset.c; renderApp(); },
  'explore-go-cat': el => { exploreCat = el.dataset.c; exploreTab = 'popular'; navigate('#explore'); },
  'search-filter': el => { searchFilter = el.dataset.f; renderApp(); },
  'search-suggest': el => { searchQuery = el.dataset.q; renderApp(); },
  'lib-tab': el => { libTab = el.dataset.tab; renderApp(); },
  'save-monthly': () => { const ta = $('#monthly-text'); if (!ta || !ta.value.trim()) { toast('Write a line or two first'); return; } S.journalEntries.push({ id: 'm' + Date.now(), topicId: null, loop: S.currentLoop, day: S.currentDay, date: todayStr(), text: ta.value.trim().slice(0, 1500), type: 'monthly' }); checkAchievements(S); saveState(); toast('Reflection saved', '📝'); renderApp(); },
  'knode': el => { kSelected = { kind: el.dataset.kind, key: el.dataset.key, cat: el.dataset.cat }; renderApp(); const p = $('.kpanel'); if (p) p.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); },
  'knode-clear': () => { kSelected = null; renderApp(); },
  'switch-user': el => { if (el.dataset.id === S.id) return; showFinding(() => { activateUser(el.dataset.id); kSelected = null; journeyLoopView = null; yrStage = 'review'; navigate('#home'); renderApp(); toast(`Switched to ${S.user.name || 'your Loop'}`, '↻'); }, 'Loading a different journey…'); },
  'start-onboarding': () => { ob = freshOb(); ob.step = 1; renderOnboarding(); },
  'save-name': () => { S.user.name = $('#profile-name').value.trim().slice(0, 32); saveState(); toast('Saved', '✓'); renderApp(); },
  'toggle-interest': el => { const c = el.dataset.c; const i = S.user.interests.indexOf(c); if (i >= 0) S.user.interests.splice(i, 1); else S.user.interests.push(c); profileChanged(); renderApp(); },
  'profile-set': el => { const k = el.dataset.k, v = el.dataset.v; if (k === 'surprise') S.user.surprisePreference = SURPRISE_MAP[v]; else if (k === 'preferredReadingTime') S.user.preferredReadingTime = +v; else S.user[k] = v; profileChanged(); renderApp(); },
  'demo-next-day': () => { const before = S.currentDay; demoAdvanceDay(); renderApp(); if (S.currentDay !== before) toast(`Day ${S.currentDay} — a new Loop is ready`, '☀️'); },
  'demo-ff': () => showFinding(() => { demoFastForward(364); renderApp(); toast('Fast-forwarded to Day 364. One day left in this Loop.', '⏩'); }, 'Simulating your year…'),
  'export': () => exportState(),
  'reset-user': () => showModal(`<h3>Reset this learner?</h3><p class="muted">All progress, journal entries and preferences for this learner will be erased from this device.</p><div class="row mt-3"><button class="btn primary" data-action="reset-user-confirm" style="background:var(--bad)">Reset</button><button class="btn ghost" data-action="close-modal">Cancel</button></div>`),
  'reset-user-confirm': () => { const id = S.id; resetState(id); closeModal(); S = null; if (DEMO_USERS.find(d => d.id === id)) { activateUser(id); renderApp(); toast('Learner reset'); } else { localStorage.removeItem(KEY_ACTIVE); ob = freshOb(); location.hash = ''; renderOnboarding(); } },
  'reset-all': () => showModal(`<h3>Erase everything?</h3><p class="muted">All learners, journals and settings stored by Keep Loop in this browser will be removed.</p><div class="row mt-3"><button class="btn primary" data-action="reset-all-confirm" style="background:var(--bad)">Erase all</button><button class="btn ghost" data-action="close-modal">Cancel</button></div>`),
  'reset-all-confirm': () => { resetAll(); closeModal(); S = null; G = { theme: 'system', reduceMotion: false }; applyTheme(); ob = freshOb(); location.hash = ''; renderOnboarding(); },
  'set-theme': el => { G.theme = el.dataset.t; applyTheme(); saveState(); renderApp(); },
  'cycle-theme': () => { const order = ['light', 'dark', 'system']; G.theme = order[(order.indexOf(G.theme) + 1) % 3]; applyTheme(); saveState(); renderApp(); toast('Theme: ' + G.theme[0].toUpperCase() + G.theme.slice(1)); },
  'toggle-motion': () => { G.reduceMotion = !G.reduceMotion; applyTheme(); saveState(); renderApp(); },

  'begin-loop': () => showFinding(() => { beginNewLoop(S); yrStage = 'next'; renderApp(); }, 'Building your next Loop from everything you learned…'),
  'start-next-loop': () => { yrStage = 'review'; navigate('#home'); toast(`Loop ${pad2(S.currentLoop)} · Day 001. Welcome back.`, '🔄'); },

  'ob-back': () => { ob.step = ob.step === 'demo' ? 0 : Math.max(0, ob.step - 1); renderOnboarding(); },
  'ob-demo': () => { ob.step = 'demo'; renderOnboarding(); },
  'ob-pick-demo': el => showFinding(() => { activateUser(el.dataset.id); showApp(); navigate('#home'); renderApp(); }, 'Loading a personal journey…'),
  'ob-toggle-interest': el => { const c = el.dataset.c; const i = ob.interests.indexOf(c); if (i >= 0) ob.interests.splice(i, 1); else ob.interests.push(c); renderOnboarding(); },
  'ob-set': el => { const k = el.dataset.k; ob[k] = k === 'time' ? +el.dataset.v : el.dataset.v; renderOnboarding(); },
  'ob-finish': (el, e, d) => { const save = (d && d.save === '1') || (el && el.dataset.save === '1'); const inp = $('#ob-name'); if (inp) ob.name = inp.value; showFinding(() => finishOnboarding(save)); },
  'ob-start-lesson': el => { showApp(); navigate('#lesson/' + el.dataset.id); renderApp(); },
  'ob-go-home': () => { showApp(); navigate('#home'); renderApp(); }
};

document.addEventListener('click', e => { const el = e.target.closest('[data-action]'); if (!el) return; const fn = ACTIONS[el.dataset.action]; if (fn) { e.preventDefault(); fn(el, e); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g.knode')) { e.preventDefault(); ACTIONS.knode(e.target); }
});
window.addEventListener('hashchange', () => renderApp());
